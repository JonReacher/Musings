<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La Bella Plantación: a tobacco life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Nunito:wght@600;700;800&family=Playfair+Display:wght@700&family=Cinzel:wght@600&family=Abril+Fatface&family=Rye&family=Lobster&family=Great+Vibes&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{ --cream:#f7ecd0; --cream2:#efe0b8; --wood:#7a4b25; --wood2:#5b3517; --ink:#3b2410; --gold:#f2c14e; --red:#c4462f; --green:#2f6b1f; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#1d8fb0;font-family:Nunito,system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none}
  canvas{display:block;touch-action:none;cursor:crosshair}
  canvas.pan{cursor:grab}
  .panel{background:linear-gradient(#fbf3dc,var(--cream));border:3px solid var(--wood);border-radius:14px;box-shadow:0 3px 0 var(--wood2),0 8px 18px rgba(0,0,0,.28)}
  #hud{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:10px;align-items:stretch;pointer-events:none;flex-wrap:wrap}
  #hud .panel{pointer-events:auto;padding:8px 14px;display:flex;align-items:center;gap:12px}
  .farm h1{font-family:"Bree Serif",serif;font-size:20px;margin:0;line-height:1.1;color:var(--wood2)}
  .farm small{display:block;font-size:12px;opacity:.75;font-weight:700}
  .cash{font-family:"Bree Serif",serif;font-size:24px;color:var(--green);min-width:120px}
  .cash.flash{color:var(--red);animation:shake .35s}
  .lbl{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.65;display:block}
  .date{font-family:"Bree Serif",serif;font-size:18px;min-width:120px}
  .wx{display:flex;align-items:center;gap:8px}
  .wx svg{width:30px;height:30px}
  .speed{display:flex;gap:4px}
  .btn{font:800 13px Nunito,sans-serif;color:var(--ink);background:linear-gradient(#fffaf0,var(--cream2));border:2px solid var(--wood);border-radius:9px;padding:5px 9px;cursor:pointer;box-shadow:0 2px 0 var(--wood2)}
  .btn:hover{background:linear-gradient(#fffdf6,#f6e7c2)}
  .btn.on{background:linear-gradient(#ffe08a,var(--gold));border-color:#9a5d12;box-shadow:0 2px 0 #7a4610}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.sm{font-size:11.5px;padding:3px 7px;border-radius:7px}
  #toolbar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;padding:8px}
  .tool{display:flex;flex-direction:column;align-items:center;gap:2px;width:78px;padding:7px 4px 6px;border-radius:11px;position:relative}
  .tool svg{width:26px;height:26px;stroke:var(--wood2);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tool b{font-size:12.5px}
  .tool i{font-style:normal;font-size:10px;opacity:.7;font-weight:700;white-space:nowrap}
  .tool kbd{position:absolute;top:3px;right:6px;font:800 9px Nunito;opacity:.45}
  .subbar{position:fixed;left:50%;bottom:118px;transform:translateX(-50%);display:none;gap:6px;padding:7px}
  .subbar.show{display:flex}
  .opt{display:flex;align-items:center;gap:7px;padding:6px 10px;text-align:left}
  .opt span.sw{width:14px;height:14px;border-radius:50%;border:2px solid var(--wood2);flex:none}
  .opt small{display:block;font-size:10px;opacity:.75;max-width:170px}
  #tip{position:fixed;pointer-events:none;display:none;padding:8px 11px;font-size:13px;line-height:1.35;max-width:270px;border-radius:11px;z-index:5}
  #tip b{font-family:"Bree Serif",serif;font-weight:400;font-size:15px}
  #tip .cost{font-family:"Bree Serif",serif;font-size:18px}
  .bad{color:var(--red);font-weight:800}
  .ok{color:var(--green);font-weight:800}
  #info{position:fixed;left:12px;bottom:14px;width:236px;padding:10px 13px;font-size:13px;line-height:1.45}
  #info h3,#ops h3{margin:0 0 4px;font-family:"Bree Serif",serif;font-weight:400;font-size:17px;color:var(--wood2)}
  .row{display:flex;justify-content:space-between;gap:8px}
  .row span:first-child{opacity:.65;font-weight:700}
  .bar{height:7px;border-radius:4px;background:#e2cf9f;margin-top:4px;overflow:hidden;border:1px solid #b99a5c;position:relative}
  .bar div{height:100%;background:linear-gradient(90deg,#7cc04f,#d8c24a)}
  #ops{position:fixed;right:12px;top:84px;width:370px;max-height:calc(100vh - 210px);overflow:auto;padding:10px 12px;font-size:12.5px;line-height:1.4;display:none}
  #ops.show{display:block}
  #ops h4{font-family:"Bree Serif",serif;font-weight:400;font-size:14.5px;margin:12px 0 4px;color:var(--wood2);border-bottom:1.5px solid #d9c38f;padding-bottom:2px}
  .card{background:#fffaf0;border:1.5px solid #d9c38f;border-radius:10px;padding:7px 9px;margin:6px 0}
  .card.hl{border-color:#d99a1e;box-shadow:0 0 0 2px #f2c14e}
  .card .t{font-weight:800}
  .lot{display:flex;align-items:center;gap:7px;padding:5px 0;border-top:1px dashed #e0cf9f}
  .lot:first-of-type{border-top:none}
  .lot .sw{width:16px;height:16px;border-radius:4px;border:1.5px solid rgba(0,0,0,.3);flex:none}
  .lot .grow{flex:1;min-width:0}
  .lot .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .grade{display:inline-block;font:800 10.5px Nunito;padding:0 5px;border-radius:5px;background:#5b3517;color:#ffe08a;margin-left:3px}
  .muted{opacity:.65}
  .gauge{height:10px;border-radius:5px;background:#eadab0;border:1px solid #b99a5c;position:relative;margin:3px 0}
  .gauge .band{position:absolute;top:0;bottom:0;background:rgba(110,180,80,.45)}
  .gauge .danger{position:absolute;top:0;bottom:0;right:0;background:rgba(200,70,50,.35)}
  .gauge .needle{position:absolute;top:-3px;width:3px;height:14px;background:var(--wood2);border-radius:2px}
  .vents{display:flex;gap:3px;margin-top:3px}
  .gauge2{margin:4px 0 2px}
  .gauge2 .track{height:12px;border-radius:6px;border:1px solid #9a7a4a;position:relative}
  .gauge2 .needle{position:absolute;top:-4px;width:4px;height:20px;background:#3b2410;border-radius:2px;box-shadow:0 0 0 1.5px #fff8e6}
  .glabels{position:relative;display:flex;justify-content:space-between;font-size:10px;font-weight:800;opacity:.7;margin-top:2px;height:13px}
  #elder{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(860px,94vw);max-height:90vh;overflow:auto;padding:16px 18px;z-index:8;display:none;font-size:13.5px;line-height:1.5}
  #elder.show,#review.show,#bench.show{display:block}
  #bench{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(900px,95vw);max-height:92vh;overflow:auto;padding:16px 18px;z-index:9;display:none;font-size:13.5px;line-height:1.5}
  #bench .closeX{position:absolute;right:14px;top:12px}
  #bench h2{font-family:"Bree Serif",serif;font-weight:400;margin:0;font-size:24px;color:var(--wood2)}
  #bench h3{font-family:"Bree Serif",serif;font-weight:400;margin:0 0 6px;font-size:18px;color:var(--wood2)}
  #bench .ebody{display:grid;gap:12px;margin-top:12px}
  #bench .etext{background:#fffaf0;border:1.5px solid #d9c38f;border-radius:12px;padding:10px 14px}
  #bench select,#bench input[data-b="name"]{width:100%;font:700 12.5px Nunito,sans-serif;padding:5px 7px;border:2px solid #b99a5c;border-radius:8px;background:#fffdf6;color:var(--ink)}
  .fl{display:block;margin:8px 0 3px;font-weight:800}
  .fl small{font-weight:700;opacity:.65;margin-left:4px}
  .fillrow{display:grid;grid-template-columns:1fr 110px 40px;gap:6px;align-items:center;margin-bottom:4px}
  .stars{color:#c98612;letter-spacing:1px}
  .stars .dim{color:#e2d3ac}
  .tabs{display:flex;gap:4px;margin-bottom:6px;position:sticky;top:-10px;background:var(--cream);padding:4px 0;z-index:2}
  .spark{width:100%;height:auto;display:block;margin:4px 0}
  #review{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,94vw);max-height:90vh;overflow:auto;padding:16px 18px;z-index:9;display:none;font-size:13.5px;line-height:1.55}
  #review .closeX{position:absolute;right:14px;top:12px}
  #review h2{font-family:"Bree Serif",serif;font-weight:400;margin:0;font-size:24px;color:var(--wood2)}
  #review h3{font-family:"Bree Serif",serif;font-weight:400;margin:0 0 6px;font-size:18px;color:var(--wood2)}
  #review .ebody{display:grid;gap:12px;margin-top:12px}
  #review .etext{background:#fffaf0;border:1.5px solid #d9c38f;border-radius:12px;padding:10px 14px}
  #review .said{font-style:italic;background:#fffaf0;border:1.5px solid #d9c38f;border-radius:10px;padding:8px 12px}
  #elder .closeX{position:absolute;right:14px;top:12px}
  #elder h2{font-family:"Bree Serif",serif;font-weight:400;margin:0;font-size:24px;color:var(--wood2)}
  #elder h3{font-family:"Bree Serif",serif;font-weight:400;margin:0 0 6px;font-size:19px;color:var(--wood2)}
  #elder h4{font-family:"Bree Serif",serif;font-weight:400;font-size:15px;color:var(--wood2)}
  .ehead{display:flex;gap:16px;align-items:center;padding-right:70px}
  .ehead > div{flex:1}
  .portrait{width:104px;height:104px;flex:none}
  .said{margin-top:8px;font-style:italic;background:#fffaf0;border:1.5px solid #d9c38f;border-radius:10px;padding:6px 10px}
  .ebody{display:grid;grid-template-columns:240px 1fr;gap:14px;margin-top:12px}
  .elist{display:flex;flex-direction:column;gap:5px}
  .lesson{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:6px;font-size:12.5px}
  .lesson small{font-size:10px;opacity:.7;white-space:nowrap}
  .lesson.locked{opacity:.6}
  .etext{background:#fffaf0;border:1.5px solid #d9c38f;border-radius:12px;padding:12px 16px;min-height:220px}
  .etext p{margin:0 0 9px}
  .mission{margin-top:10px;padding:8px 10px;border:1.5px dashed #c9a24a;border-radius:10px;background:#fff6dc}
  .choices{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
  .choice{padding:4px}
  .leafsvg{width:74px;height:90px;display:block}
  .bigsvg{width:220px;height:165px;display:block;margin:6px auto}
  .days{display:flex;gap:5px;margin:8px 0;flex-wrap:wrap}
  .daycard{border:1.5px solid #d9c38f;border-radius:8px;padding:3px 5px;text-align:center;font-size:10.5px;min-width:56px;background:#fffaf0}
  .daycard.now{border-color:#d99a1e;box-shadow:0 0 0 2px #f2c14e}
  .daycard .mini svg{width:22px;height:22px}
  .daycard b{display:block;font-size:12px}
  .favors{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
  .favor{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px}
  .favor small{font-size:10.5px;opacity:.75;font-weight:700}
  .favor .gain{color:var(--green);opacity:1}
  @media (max-width:700px){.ebody{grid-template-columns:1fr}}
  .opt.locked{opacity:.55}
  #fc{display:none;gap:4px;align-items:center;border-left:1.5px solid #d9c38f;padding-left:8px}
  #fc.show{display:flex}
  #fc span{display:flex;flex-direction:column;align-items:center;font-size:9.5px;font-weight:800;opacity:.8}
  #fc svg{width:20px;height:20px}
  #saveStat{font-size:10.5px;font-weight:700;margin-left:2px}
  #menu{position:fixed;inset:0;background:rgba(20,40,50,.45);z-index:20;display:none;align-items:center;justify-content:center}
  #menu.show{display:flex}
  .menubox{width:min(720px,94vw);max-height:92vh;overflow:auto;padding:18px 20px;font-size:13.5px;line-height:1.5}
  .menubox h1{font-family:"Bree Serif",serif;font-weight:400;font-size:30px;margin:0;color:var(--wood2)}
  .menubox h3{font-family:"Bree Serif",serif;font-weight:400;font-size:18px;margin:14px 0 6px;color:var(--wood2)}
  .slot{display:flex;align-items:center;gap:10px;background:#fffaf0;border:1.5px solid #d9c38f;border-radius:12px;padding:9px 12px;margin:6px 0}
  .slot .grow{flex:1}
  .slot b{font-family:"Bree Serif",serif;font-weight:400;font-size:16px}
  .menubox input,.menubox textarea{font:700 13px Nunito,sans-serif;padding:6px 9px;border:2px solid #b99a5c;border-radius:8px;background:#fffdf6;color:var(--ink);width:100%}
  .menubox textarea{height:70px;font-size:11px}
  .formrow{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
  .formrow label{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;opacity:.7}
  #talk{position:fixed;right:14px;bottom:122px;width:min(470px,92vw);display:none;gap:14px;padding:14px 16px;z-index:12;align-items:flex-start}
  body.inscene #talk{right:auto;left:14px;bottom:14px}
  #talk.show{display:flex;animation:talkin .35s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes talkin{from{transform:translateY(24px) scale(.96);opacity:0}to{transform:none;opacity:1}}
  .tportrait{flex:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}
  .tface,.face{width:100px;height:100px;display:block}
  .tbody{flex:1;min-width:0}
  .tname{font-family:"Bree Serif",serif;font-size:19px;color:var(--wood2);line-height:1.1}
  .trole{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;opacity:.6;margin-bottom:6px}
  .ttext{font-size:14px;line-height:1.5;background:#fffaf0;border:1.5px solid #d9c38f;border-radius:4px 12px 12px 12px;padding:8px 11px;font-style:italic}
  .tchoices{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .ttext .deal{font-style:normal;margin-top:8px;background:#fff;border:1.5px solid #e2cf9e;border-radius:8px;padding:5px 8px;font-size:12.5px}
  .deal .drow{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed #ead9b0}
  .deal .drow:last-of-type{border-bottom:0}
  .deal .drow b{font-variant-numeric:tabular-nums;text-align:right}
  .deal .drow.up b{color:#2f6b4f} .deal .drow.down b{color:#a8321e}
  .deal .dnote{font-size:11.5px;opacity:.75;margin-top:4px;line-height:1.35}
  .tmore{font-size:10.5px;font-weight:800;opacity:.55;margin-top:6px}
  .miniface svg{width:46px;height:46px;display:block}
  .miniface{flex:none}
  #scene{position:fixed;inset:0;background:rgba(20,30,30,.55);z-index:10;display:none;align-items:center;justify-content:center}
  #scene.show{display:flex}
  .scenebox{width:min(1320px,97vw);height:min(760px,92vh);display:flex;flex-direction:column;padding:12px 14px}
  .scenehead{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
  .scenehead h2{font-family:"Bree Serif",serif;font-weight:400;font-size:24px;margin:0;color:var(--wood2)}
  .scenehead .btn{margin-left:auto}
  .scenegrid{flex:1;min-height:0;display:grid;grid-template-columns:1.9fr 1fr;gap:12px}
  .sceneleft{min-height:0;display:flex;flex-direction:column;gap:8px}
  .sceneart{width:100%;aspect-ratio:8/5;max-height:100%;border-radius:12px;overflow:hidden;border:3px solid #5b3517;background:#3b2410}
  .scenehint{font-size:12px;font-weight:700;opacity:.65}
  .scenesvg{width:100%;height:100%;display:block}
  .scenesvg .hot{cursor:pointer;transition:filter .15s}
  .scenesvg .hot:hover{filter:brightness(1.12) drop-shadow(0 0 6px rgba(255,230,150,.9))}
  .chalk{font-family:Caveat,cursive;fill:#f4f1e6}
  .sceneside{min-height:0;overflow:auto;background:#fffaf0;border:1.5px solid #d9c38f;border-radius:12px;padding:8px 12px;font-size:12.5px;line-height:1.4}
  .sceneside h4{font-family:"Bree Serif",serif;font-weight:400;font-size:15px;margin:10px 0 4px;color:var(--wood2);border-bottom:1.5px solid #e6d3a6;padding-bottom:2px}
  .scenegrid{grid-template-columns:1.22fr 1fr}
  .schips{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
  .schip{font-size:11.5px;font-weight:800;background:#fffaf0;border:1.5px solid #e2cf9e;border-radius:12px;padding:2px 9px;white-space:nowrap}
  .schip.ok{background:#e8f3ea;border-color:#9cc7a8;color:#24563d} .schip.warn{background:#fff3d6;border-color:#e0a53a;color:#7a4a08;cursor:pointer} .schip.bad{background:#fbe3dc;border-color:#d46a50;color:#8a2a16;cursor:pointer}
  .sceneside .tabs{background:#fffaf0;top:-8px}
  .chart{width:100%;height:auto;display:block;margin:2px 0}
  .chart .cl{font-size:10px;fill:#7a5a3a;font-family:Nunito,sans-serif;font-weight:700}
  .chart .hit{fill:transparent} .chart .hit:hover{fill:rgba(160,103,63,.10)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:6px;margin:4px 0 6px}
  .kpi{background:#fff;border:1.5px solid #ead9b0;border-radius:9px;padding:5px 8px;min-width:0}
  .kpi .kl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;opacity:.6}
  .kpi .kv{font-family:"Bree Serif",serif;font-size:19px;color:#3b2410;line-height:1.2;font-variant-numeric:tabular-nums}
  .kpi .ks{font-size:11px;opacity:.72;line-height:1.3}
  .kpi.warn{border-color:#e0a53a;background:#fff7e3}
  .pipe{display:flex;align-items:stretch;gap:2px;margin:2px 0 6px}
  .pnode{flex:1;background:#fff;border:2px solid #ead9b0;border-radius:10px;padding:5px 7px;cursor:pointer;min-width:0;transition:transform .1s}
  .pnode:hover{transform:translateY(-1px)}
  .pnode.ok{border-color:#9cc7a8} .pnode.warn{border-color:#e0a53a;background:#fff7e3} .pnode.bad{border-color:#d46a50;background:#fdece6}
  .pnode .pt{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;opacity:.6}
  .pnode .pb{font-family:"Bree Serif",serif;font-size:17px;color:#3b2410;white-space:nowrap}
  .pnode .ps{font-size:10.5px;opacity:.78;line-height:1.3}
  .parrow{align-self:center;font-size:22px;font-weight:900;opacity:.35}
  .verdict{display:flex;gap:7px;padding:5px 9px;border-radius:8px;margin:4px 0;font-size:12.5px;line-height:1.35}
  .verdict .vi{font-weight:900;flex:none}
  .verdict.ok{background:#e8f3ea;color:#24563d} .verdict.warn{background:#fff3d6;color:#7a4a08} .verdict.bad{background:#fbe3dc;color:#8a2a16}
  .dtab{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums;margin:2px 0 6px}
  .dtab th{text-align:right;font-size:10px;text-transform:uppercase;letter-spacing:.03em;opacity:.65;font-weight:800;padding:3px 4px;border-bottom:1.5px solid #e6d3a6}
  .dtab td{text-align:right;padding:3px 4px;border-bottom:1px solid #f0e4c8}
  .dtab th:first-child,.dtab td:first-child{text-align:left}
  .dtab tr.tot td{font-weight:800;border-top:1.5px solid #e6d3a6;border-bottom:0}
  .legend{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11px;margin-bottom:6px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  .agebar{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;margin:5px 0}
  .agebar div:first-child{border-radius:5px 0 0 5px} .agebar div:last-child{border-radius:0 5px 5px 0}
  .week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
  .wd{background:#fff;border:1.5px solid #ead9b0;border-radius:8px;padding:4px 2px;text-align:center;font-size:11px;line-height:1.3}
  .wd.today{border-color:#a0673f;box-shadow:0 0 0 2px #f2d9a8}
  .wd.shut{background:#f1eadb;color:#8a7a62}
  .wd .wn{font-weight:900} .wd .wdt{font-size:10px;opacity:.6} .wd .wv{font-weight:700;font-size:10.5px} .wd.fut .wv{opacity:.6} .wd .wr{font-size:10.5px;color:#2f6b4f;font-weight:800}

<script>
(() => {
// ================= constants =================
const N = 32, TW = 64, TH = 32;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const cam = { x: 0, y: 0, z: 1 };
const START_CASH = 7500;
let cash = START_CASH, days = 0, speedIdx = 1, time = 0, dayInt = 0, debt = 0;
const SPEEDS = [0, 365/600, 4*365/600, 12*365/600, 40*365/600]; // in-game days per real second: 1× ≈ 10 real minutes per year
let tool = 'inspect', variety = 'criollo', btype = 'barn';

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rnd = mulberry32(1964), wrnd = mulberry32(77);

// All economic values are placeholders for tuning.
const VARS = {
  criollo:  { name:'Criollo-type',   cost:60, base:1.00, kg:110, leaf:'#4f9c3b', dark:'#2f6a24', sw:'#4f9c3b', note:'Balanced, aromatic' },
  corojo:   { name:'Corojo-type',    cost:95, base:1.15, kg:85, leaf:'#3a8d3a', dark:'#225c22', sw:'#2f7a34', note:'Spicy, fragile, prized' },
  habano:   { name:'Habano-type',    cost:50, base:0.90, kg:130, leaf:'#62a944', dark:'#3a7228', sw:'#6cb04a', note:'Hardy, high yield' },
  broadleaf:{ name:'Broadleaf-type', cost:55, base:0.95, kg:140, leaf:'#447f2d', dark:'#2a5419', sw:'#3d6f27', note:'Big, dark leaves' },
};
const STAGES = ['Seedlings','Transplants','Vegetative growth','Tall growth','Budding','Mature','Picking season'];
const RIPE = 110, WINDOW = 28; // the first priming ripens at day 110; each priming keeps full quality for ~4 weeks
// One tile is about 0.1 hectare. Each plant is picked in three passes (primings), bottom to top.
// Each priming is a different leaf: it ripens, cures, ferments and sells differently. Values are placeholders.
const PRIM = [
  { name:'Volado', start:110, cure:35, heat:380, turns:2, share:0.30, price:0.75, mold:0.8,  traits:'Mild · light flavor · burns well',  desc:'thin bottom leaves' },
  { name:'Seco',   start:118, cure:45, heat:480, turns:3, share:0.40, price:1.00, mold:1.0,  traits:'Medium · aromatic · balanced',      desc:'middle leaves' },
  { name:'Ligero', start:128, cure:55, heat:620, turns:4, share:0.30, price:1.35, mold:1.25, traits:'Strong · rich · burns slowly',      desc:'thick, oily top leaves' },
];
const nextPrim = t => (t.work==='seeded' && (t.pr||0)<3) ? PRIM[t.pr||0] : null;
const urgency = t => t.g - nextPrim(t).start;
function stageOf(g){ return g<12?0 : g<35?1 : g<60?2 : g<85?3 : g<97?4 : g<RIPE?5 : 6; }

const BTYPES = {
  shack: { name:'Your shack', w:1, h:1 },
  house: { name:'Don Aurelio’s house', w:1, h:1 },
  nbarn: { name:'Don Aurelio’s barn', w:1, h:1 },
  church:{ name:'Church of San Rafael', w:1, h:1 },
  cottage:{ name:'A house in town', w:1, h:1 },
  factory:{ name:'Tabacalera San Rafael', w:2, h:2 },
  barn:  { name:'Curing barn', w:2, h:2, cost:4200, days:24, desc:'Hangs 36 pickings at once (one priming from one tile)' },
  ferm:  { name:'Fermentation house', w:2, h:2, cost:3600, days:20, desc:'Two pilones for fermenting cured leaf' },
  ware:  { name:'Aging warehouse', w:2, h:2, cost:3000, days:18, desc:'Stores bales to age, 2,500 kg' },
  galera:{ name:'Rolling workshop', w:2, h:2, cost:5500, days:25, desc:'Rolling tables for 6 rollers and a cedar room where cigars rest' },
  stand: { name:'Roadside cigar stand', w:1, h:1, cost:1800, days:10, desc:'Sell your cigars to passers-by. Must touch a road' },
};
const BUILDABLE = ['barn','ferm','ware','galera','stand'];
const BALE_COST = 0.25;
const turnCost = () => perk('pilonHands') ? 20 : 40;

// ================= map =================
const map = [], buildings = []; let nextB = 1;
const T = (r,c) => (r>=0&&c>=0&&r<N&&c<N) ? map[r][c] : null;
// buildings
function addB(type, c, r, opt={}){
  const b = Object.assign({ id:nextB++, type, c, r, w:BTYPES[type].w, h:BTYPES[type].h, owned:false, built:true, prog:0, worn:false, vent:'half', hum:70, piles:[0,0], forSale:0 }, opt);
  let lvl = 9; for (let rr=r; rr<r+b.h; rr++) for (let cc=c; cc<c+b.w; cc++) lvl = Math.min(lvl, map[rr][cc].h ?? 0);
  for (let rr=r; rr<r+b.h; rr++) for (let cc=c; cc<c+b.w; cc++){ const t=map[rr][cc]; t.b=b.id; if (t.h!=null) t.h = lvl; if (b.w>1 && !t.town){ t.t='cleared'; } }
  buildings.push(b); return b;
}
function generateWorld(){
rnd = mulberry32(1964); map.length = 0; buildings.length = 0; nextB = 1;
for (let r=0;r<N;r++){ map.push([]); for (let c=0;c<N;c++) map[r].push({r,c,t:'grass',owned:false,work:null,g:0,v:null,n:rnd(),n2:rnd(),b:0,price:0,hp:1,neighbor:false}); }
for (let r=0;r<N;r++) for (let c=0;c<N;c++){
  const t = map[r][c];
  const f = 0.5 + 0.22*Math.sin(r*0.62+1.3)*Math.cos(c*0.5+0.4) + 0.18*Math.sin((r+c)*0.33+2.1) + (t.n-0.5)*0.22;
  if (f > 0.66) t.t = 'forest'; else if (f > 0.55) t.t = 'scrub';
}
for (let r=0;r<N;r++){ const mid = 22 + Math.round(2*Math.sin(r*0.3)); for (let c=mid; c<=mid+1; c++) map[r][c].t='water'; }
for (let r=0;r<N;r++) map[r][4].t='road';
for (let c=5;c<=10;c++) map[13][c].t='road';
for (let r=18;r<=21;r++) for (let c=9;c<=13;c++) map[r][c].t='field';
for (let r=11;r<=14;r++) for (let c=11;c<=14;c++){ const t=map[r][c]; t.t='grass'; t.owned=true; }
for (let r=15;r<=17;r++) for (let c=16;c<=17;c++){ map[r][c].t='grass'; map[r][c].neighbor=true; }
for (let r=0;r<=7;r++) for (let c=0;c<=3;c++){ map[r][c].t='town'; map[r][c].town=true; }
// terrain height 0-3: rolling ground, your farm on a low hill, the river valley at the bottom
for (const row of map) for (const t of row){
  const hill = 1.7*Math.exp(-((t.r-12.5)**2 + (t.c-12)**2)/22);
  const ridge = 1.5*Math.exp(-((t.r-25)**2/30 + (t.c-8)**2/40));
  let e = 0.9 + 0.7*Math.sin(t.r*0.23+0.4)*Math.cos(t.c*0.2+1.2) + 0.35*Math.sin((t.r+t.c)*0.15+2) + hill + ridge;
  let dw = 99; for (let dc=-4; dc<=4; dc++){ const o=T(t.r,t.c+dc); if (o && o.t==='water') dw = Math.min(dw, Math.abs(dc)); }
  if (dw<=4) e = Math.min(e, dw*0.45);
  if (t.town) e = 1;
  t.h = t.t==='water' ? 0 : Math.max(0, Math.min(3, Math.round(e)));
}
for (let pass=0; pass<4; pass++) for (const row of map) for (const t of row){
  for (const o of [T(t.r-1,t.c),T(t.r+1,t.c),T(t.r,t.c-1),T(t.r,t.c+1)]) if (o && t.h > o.h+1) t.h = o.h+1;
}

// hidden soil: every tile has its own chemistry, revealed only by testing or by farming it
for (const row of map) for (const t of row){
  const f = Math.sin(t.r*0.27+0.6)*Math.cos(t.c*0.31+1.9), g2 = Math.sin((t.r-t.c)*0.21+0.8);
  let nearWater = false;
  for (let dr=-2;dr<=2;dr++) for (let dc=-2;dc<=2;dc++){ const o=T(t.r+dr,t.c+dc); if (o&&o.t==='water') nearWater=true; }
  const so = { ph: 5.95 + 0.45*f + 0.35*g2 + (t.n2-0.5)*0.4, nit: 0.55 + 0.2*g2 + (t.n-0.5)*0.2, drain: 0.62 + 0.18*f + (t.n2-0.5)*0.2, shank: 0, consec: 0, fallow: 400 };
  if (t.t==='forest'){ so.nit += 0.2; so.drain += 0.1; }
  if (t.t==='scrub') so.nit += 0.08;
  if (t.t==='field'){ so.nit -= 0.22; so.shank = t.n<0.5 ? 0.55 : 0; so.consec = 3; so.fallow = 60; }
  if (nearWater){ so.drain -= 0.28; so.nit += 0.1; }
  so.nit -= 0.04*(t.h||0);
  so.ph = Math.max(4.8, Math.min(7.6, so.ph)); so.nit = Math.max(0.1, Math.min(1, so.nit)); so.drain = Math.max(0.1, Math.min(1, so.drain));
  t.soil = so;
}

addB('shack', 11, 13, { owned:true });
addB('house', 16, 16, { neighbor:true });
addB('nbarn', 17, 16, { neighbor:true });
// the town of San Rafael, up the road
addB('church', 1, 1, { town:true });
for (const [c,r] of [[3,0],[0,3],[2,3],[3,2],[3,5],[2,7]]) addB('cottage', c, r, { town:true });
addB('factory', 0, 5, { town:true });
for (const [r,c] of [[8,6],[8,7],[9,6],[9,7]]) map[r][c].t='grass';
addB('barn', 6, 8, { worn:true, forSale:2600 });          // an abandoned curing barn by the road
for (const [r,c] of [[20,14],[20,15],[21,14],[21,15]]) map[r][c].t='grass';
addB('ware', 14, 20, { worn:true, forSale:2200 });        // an old tobacco warehouse past the field
for (const row of map) for (const t of row){
  const base = {grass:420, scrub:320, forest:260, field:650, cleared:420}[t.t] || 0;
  let nearWater = false;
  for (let dr=-2;dr<=2;dr++) for (let dc=-2;dc<=2;dc++){ const o=T(t.r+dr,t.c+dc); if(o&&o.t==='water') nearWater=true; }
  t.price = Math.round((base + (nearWater?80:0) + (t.h||0)*25) * (0.9 + 0.2*t.n2) / 10) * 10;
  if (t.b){ const b=Bid(t.b); if (b.forSale) t.price += b.forSale/(b.w*b.h); }
}
}
const Bid = id => buildings.find(b => b.id===id);
generateWorld();

function bldTiles(b){ const a=[]; for (let r=b.r;r<b.r+b.h;r++) for (let c=b.c;c<b.c+b.w;c++) a.push(map[r][c]); return a; }
function forSale(t){
  if (t.owned || t.neighbor || t.town) return false;
  if (t.b){ const b=Bid(t.b); return b.forSale>0; }
  return ['grass','scrub','forest','field','cleared'].includes(t.t);
}
function bName(b){
  if (b.worn) return b.type==='barn' ? 'Old curing barn' : 'Old warehouse';
  const same = buildings.filter(x => x.type===b.type && !x.worn && x.owned);
  const i = same.indexOf(b);
  return BTYPES[b.type].name + (same.length>1 && i>=0 ? ' '+(i+1) : '');
}
const barnCap = b => b.worn ? 20 : 36; // in pickings: one priming from one tile
const wareCap = b => b.worn ? 1500 : 2500;
const ready = type => buildings.filter(b => b.type===type && b.owned && b.built);

// ================= leaf lots =================
const lots = []; let nextLot = 1;
const barnUsed = b => lots.filter(l => l.loc===b.id && (l.stage==='curing'||l.stage==='cured')).reduce((s,l)=>s+l.picks,0);
const wareUsed = b => lots.filter(l => l.loc===b.id && l.stage==='baled').reduce((s,l)=>s+l.kg,0);
const freeBarn = () => ready('barn').reduce((s,b)=>s+Math.max(0,barnCap(b)-barnUsed(b)),0);
function grade(q){ return q>=1.2?'A+':q>=1.05?'A':q>=0.9?'B':q>=0.75?'C':'D'; }
function price(l){
  const pm = PRIM[l.pr].price;
  const base = l.stage==='curing'?0 : l.stage==='cured'?8 : l.stage==='fermenting'?0 : l.stage==='fermented'?13 : 13 + Math.min(10, l.age/30*0.8)*(perk('patience')?1.1:1);
  return base * pm * l.q * (perk('buyerTrust')?1.08:1);
}
function leafColor(l){
  if (l.stage==='curing'){ const f=l.cd/PRIM[l.pr].cure; return f<0.45 ? mix('#6aa84f','#d6c25a',f/0.45) : mix('#d6c25a','#9a6431',(f-0.45)/0.55); }
  if (l.stage==='cured') return '#9a6431';
  if (l.stage==='fermenting') return mix('#9a6431','#5e3a1c', Math.min(1,l.heat/PRIM[l.pr].heat));
  return l.stage==='baled' ? mix('#5e3a1c','#4a2c14', Math.min(1,l.age/365)) : '#5e3a1c';
}

// ================= weather =================
const WX = { Sunny:{hum:60}, Cloudy:{hum:72}, Rain:{hum:88}, Storm:{hum:95} };
let wx = 'Sunny';
function curMonth(){ return new Date(Date.UTC(2025,9,1) + Math.floor(days)*864e5).getUTCMonth(); }
const wetSeason = () => { const m=curMonth(); return m>=4 && m<=9; };
let wxQ = [];
const monthAt = d => new Date(Date.UTC(2025,9,1) + Math.floor(d)*864e5).getUTCMonth();
function rollWx(prev, m){
  const wet = m>=4 && m<=9, r = wrnd(), raining = prev==='Rain'||prev==='Storm';
  if (prev==='Storm') return r<0.4 ? 'Storm' : 'Rain';
  if (raining){ const w = r < (wet?0.55:0.3) ? 'Rain' : (r<0.8?'Cloudy':'Sunny'); return (w==='Rain' && wet && wrnd()<0.07) ? 'Storm' : w; }
  return r < (wet?0.3:0.07) ? 'Rain' : r < (wet?0.6:0.35) ? 'Cloudy' : 'Sunny';
}
function weatherTick(){
  while (wxQ.length < 4) wxQ.push(rollWx(wxQ.length ? wxQ[wxQ.length-1] : wx, monthAt(dayInt + wxQ.length)));
  const prev = wx; wx = wxQ.shift();
  if (wx==='Storm' && prev!=='Storm') startStorm();
}
function startStorm(){
  let hit = 0; const k = perk('stormwise') ? 0.5 : 1;
  for (const row of map) for (const t of row) if (t.work==='seeded' && stageOf(t.g)>=3){ t.hp = Math.max(0.5, t.hp - (0.05 + 0.08*wrnd())*k); hit++; }
  attention(hit ? 'A storm is battering the valley. Tall plants took some damage.' : 'A storm is rolling through the valley.');
}

// ================= tools =================
const ICONS = {
  inspect:'<path d="M7 11V6a1.5 1.5 0 013 0v5M10 10V4.5a1.5 1.5 0 013 0V10M13 10V5.5a1.5 1.5 0 013 0V12M16 10a1.5 1.5 0 013 0v3.5c0 4-3 7.5-7 7.5-3 0-5-1.6-6.6-4.4L4 14a1.5 1.5 0 012.6-1.4L7 14"/>',
  buy:'<path d="M6 21V3M6 4h11l-2.5 4L17 12H6"/>',
  clear:'<path d="M14 3l6 6-3.5 1.5L12.5 6.5zM13 8L4 21"/>',
  plow:'<path d="M3 7c3 1.5 6 1.5 9 0s6-1.5 9 0M3 12c3 1.5 6 1.5 9 0s6-1.5 9 0M3 17c3 1.5 6 1.5 9 0s6-1.5 9 0"/>',
  seed:'<path d="M12 21v-9M12 13c0-4.5-3-7-7.5-7 0 4.5 3 7 7.5 7zM12 11c0-3.5 2.5-6 6.5-6 0 3.5-2.5 6-6.5 6"/>',
  build:'<path d="M3 11l9-7 9 7M5 10v10h14V10M10 20v-6h4v6"/>',
  harvest:'<path d="M5 19C5 9 11 4 20 4c0 9-5 15-15 15zM5 19l9-9"/>',

const careCost = k => k==='top' && perk('topper') ? 10 : k==='worms' && perk('pestEye') ? 9 : k==='spray' && perk('pestEye') ? 18 : CAREACTS[k].cost;

const PLANT_T = ['grass','cleared','field'];
function eligible(tl, t){
  if (!t) return false;
  switch (tl){
    case 'buy': return forSale(t);
    case 'clear': return t.owned && !t.b && (t.t==='scrub'||t.t==='forest');
    case 'plow': return t.owned && !t.b && ['grass','cleared','field'].includes(t.t) && (t.work===null||t.work==='stalks');
    case 'seed': return t.owned && t.work==='plowed';
    case 'harvest': { const P0 = nextPrim(t); return t.owned && !!P0 && t.g>=P0.start; }
    case 'soil':
      if (t.b || !PLANT_T.concat(['scrub','forest']).includes(t.t)) return false;
      if (soilAct==='test') return (t.owned || forSale(t)) && !(t.tested && days - t.tested < 120);
      if (!t.owned || !know('land')) return false;
      if (soilAct==='lime') return t.soil.ph < 7.3;
      if (soilAct==='ditch') return t.soil.drain < 0.95;
      if (soilAct==='cover') return PLANT_T.includes(t.t) && (t.work===null||t.work==='plowed'||t.work==='stalks');
      return true;
    case 'care':
      if (!t.owned || t.work!=='seeded' || !careKnown()) return false;
      if (careAct==='top') return !t.top && t.g >= 80;
      if (careAct==='worms') return t.worm > 0;
      if (careAct==='spray') return !(t.prot > 0);
      return false;
  } return false;
}
function unitCost(tl, t){
  switch (tl){
    case 'buy': return t.price;
    case 'clear': return t.t==='forest'?450:150;
    case 'plow': return 120;
    case 'seed': return Math.round(VARS[variety].cost * (perk('seedwise')?0.8:1));
    case 'harvest': return 35;
    case 'soil': return soilCost(soilAct);
    case 'care': return careCost(careAct);
  } return 0;
}
function apply(tl, t){
  switch (tl){
    case 'buy': t.owned = true; if (t.b){ const b=Bid(t.b); if (bldTiles(b).every(x=>x.owned)){ b.owned=true; b.forSale=0; toast(`You now own the ${bName(b).toLowerCase()}.`); } } break;
    case 'clear': t.t = 'cleared'; break;
    case 'plow': t.work = 'plowed'; t.g = 0; t.v = null; t.hp = 1; break;
    case 'seed': elder.stats.planted++; t.work = 'seeded'; t.g = 0; t.v = variety; t.hp = 1; t.pr = 0; t.seen = -1; t.top = 0; t.worm = 0; t.bmold = 0; t.prot = 0; t.shankHit = false; break;
    case 'soil': {
      const so = t.soil;
      if (soilAct==='test') t.tested = days || 0.01;
      if (soilAct==='lime') so.ph = Math.min(7.5, so.ph + 0.5);
      if (soilAct==='compost'){ so.nit = Math.min(1.4, so.nit + 0.22); so.drain = Math.min(1, so.drain + 0.06); }
      if (soilAct==='fert') so.nit = Math.min(1.4, so.nit + 0.35);
      if (soilAct==='ditch') so.drain = Math.min(1, so.drain + 0.3);
      if (soilAct==='cover'){ t.work = 'cover'; t.g = 0; }
      break; }
    case 'care':
      if (careAct==='top'){ t.top = t.g > 104 ? 2 : 1; if (t.g<=97) elder.stats.topOnTime++; }
      if (careAct==='worms') t.worm = 0;
      if (careAct==='spray'){ t.bmold = 0; t.prot = 21; }
      t.pick = 2; break;
  }
}

const iso = (c,r) => ({ x:(c-r)*TW/2, y:(c+r)*TH/2 });
const ELEV = 9; // pixels per terrain level
function initCam(){
  const fit = Math.min(W/(N*TW+220), (H-200)/(N*TH+120));
  cam.z = Math.max(0.6, Math.min(1.6, fit*1.7));
  const f = iso(12.5, 13.5); cam.x = W/2 - f.x*cam.z; cam.y = H/2 - f.y*cam.z - 10;

function screenToTile(sx, sy, clamp){
  const wx2 = (sx-cam.x)/cam.z, wy2 = (sy-cam.y)/cam.z;
  for (let lv=3; lv>=1; lv--){ const a = wx2/(TW/2), b = (wy2+lv*ELEV)/(TH/2); const t = T(Math.floor((b-a)/2), Math.floor((a+b)/2)); if (t && (t.h||0)===lv) return t; }
  const a = wx2/(TW/2), b = wy2/(TH/2);
  let c = Math.floor((a+b)/2), r = Math.floor((b-a)/2);
  if (clamp){ c = Math.max(0,Math.min(N-1,c)); r = Math.max(0,Math.min(N-1,r)); return map[r][c]; }
  return T(r,c);
}

function updateSel(){
  const r0=Math.min(drag.a.r,drag.b.r), r1=Math.max(drag.a.r,drag.b.r), c0=Math.min(drag.a.c,drag.b.c), c1=Math.max(drag.a.c,drag.b.c);
  // 1. every eligible tile in the rectangle, grouped into units (a building is bought whole, never in part)
  const units = [], seenB = new Set();
  for (let r=r0;r<=r1;r++) for (let c=c0;c<=c1;c++){
    const t = map[r][c]; if (!eligible(tool,t)) continue;
    if (tool==='buy' && t.b){ if (seenB.has(t.b)) continue; seenB.add(t.b); const ts = bldTiles(Bid(t.b)).filter(x=>!x.owned); units.push({ tiles:ts, cost:ts.reduce((s2,x)=>s2+x.price,0), b:t.b }); }
    else units.push({ tiles:[t], cost:unitCost(tool,t) });
  }
  const elig = units.flatMap(u=>u.tiles), total = units.reduce((s2,u)=>s2+u.cost,0);
  // 2. what will actually happen: harvest the ripest first up to barn space, then as much as cash covers
  let order = units, barnLimited = false, cashLimited = false;
  if (tool==='harvest'){ order = [...units].sort((a,b)=>urgency(b.tiles[0])-urgency(a.tiles[0])); const fb = freeBarn(); if (order.length>fb){ order = order.slice(0,fb); barnLimited = true; } }
  const act = []; let cost = 0;
  for (const u of order){ if (cost+u.cost > cash){ cashLimited = true; continue; } act.push(...u.tiles); cost += u.cost; }
  sel = { r0,r1,c0,c1, count:(r1-r0+1)*(c1-c0+1), elig, total, act, cost, barnLimited, cashLimited, bset:[...seenB] };
}

  tip.innerHTML = `<b>${toolName(tool)}</b><br>${fmt(cost)} for ${what}${extra}<br><span class="muted">Click, or drag to select more</span>`;

}
function footprint(t){ if (!t) return null; const k=BTYPES[btype]; const tiles=[]; for (let r=t.r;r<t.r+k.h;r++) for (let c=t.c;c<t.c+k.w;c++) tiles.push(T(r,c)); return tiles; }
function canPlace(tiles){
  if (!tiles || tiles.some(x=>!x)) return 'Too close to the edge of the map.';
  if (tiles.some(x=>!x.owned)) return 'You can only build on your own land.';
  if (tiles.some(x=>x.b)) return 'Something is already built here.';
  if (tiles.some(x=>!['grass','cleared','field'].includes(x.t))) return 'Clear the land first.';
  if (tiles.some(x=>x.work==='seeded')) return 'There is a crop growing here.';
  if (new Set(tiles.map(x=>x.h||0)).size>1) return 'The ground here isn’t level. Pick a flat spot.';
  if (btype==='stand' && !tiles.some(roadNext)) return 'A roadside stand has to touch a road.';
  if (btype==='galera' && !know('blend')) return 'Learn blending from Don Aurelio first (“The blender’s table”).';

}

  else h += k.cost<=cash ? `<br><span class="ok">Click to build · cash after ${fmt(cash-k.cost)}</span>` : `<br><span class="bad">You need ${fmt(k.cost-cash)} more</span>`;

function placeBuilding(t){

function placeTip(x,y){ const tip=$('tip'); tip.style.display='block'; const w=tip.offsetWidth, h=tip.offsetHeight; tip.style.left=Math.min(W-w-8,x+18)+'px'; tip.style.top=Math.max(8,y-h-14)+'px'; }

const floats = [];
function commit(){
  if (!sel || !sel.elig.length) return;
  if (!sel.act.length){ flashCash(); return; }
  cash -= sel.cost; spend(TOOL_CAT[tool], sel.cost); markDirty(); setTimeout(checkMissions, 0);
  if (tool==='harvest') harvest(sel.act); else sel.act.forEach(t => apply(tool,t));
  const p=iso((sel.c0+sel.c1+1)/2,(sel.r0+sel.r1+1)/2);
  floats.push({ x:p.x, y:p.y-10, text:'-'+fmt(sel.cost), t:0 });

    toast(tool==='harvest' && sel.barnLimited ? `Harvested ${sel.act.length} tiles. ${left} ripe tile${left>1?'s':''} stay in the field until there is barn space.` : `Done for ${sel.act.length} tiles. Cash ran out before the other ${left}.`);
  }

}
function harvest(tiles, quiet){
  const groups = {};
  for (const t of tiles){ const k = t.v+'|'+(t.pr||0); (groups[k] ||= []).push(t); }
  for (const [key, ts] of Object.entries(groups)){
    const [v, prs] = key.split('|'), pr = +prs, P0 = PRIM[pr];
    const qs = ts.map(t => { const over = t.g - (P0.start + WINDOW); const timing = over<=0 ? 1 : over<=30 ? 1-over/30*0.22 : 0.75; return VARS[v].base*timing*t.hp*soilQ(t)*careQ(t, pr)*(perk('sharpEye')?1.04:1); });
    let rest = ts.length; const qAvg = qs.reduce((a,b)=>a+b,0)/qs.length, kgAll = ts.reduce((s2,t)=>s2+VARS[v].kg*P0.share*(0.85+0.3*t.n)*t.hp*soilYield(t)*careYield(t),0);
    year.picks += ts.length; year.kg[pr] += kgAll;
    for (const b of ready('barn')){
      const free = barnCap(b)-barnUsed(b); if (free<=0 || rest<=0) continue;
      const k = Math.min(free, rest), kg = kgAll*k/ts.length;
      const fresh = lots.find(x => x.loc===b.id && x.v===v && x.pr===pr && x.stage==='curing' && x.cd<=3);
      if (fresh){ fresh.q = (fresh.q*fresh.kg + qAvg*kg)/(fresh.kg+kg); fresh.kg += kg; fresh.picks += k; }
      else lots.push({ id:nextLot++, v, pr, picks:k, kg, q:qAvg, stage:'curing', loc:b.id, cd:0, score:0, mold:0, temp:0, heat:0, turns:0, scorch:0, age:0, hotWarned:false });
      rest -= k;
    }
    ts.forEach(t => { t.pr = pr+1; if (t.pr>=3){ t.work = 'stalks'; endCrop(t); } });
  }
  if (!quiet){ toast(`Fresh leaf is hanging in the barn. Keep the humidity in the green band.`); opsOpen = true; }
}

// ================= soil & crop health =================
const slopeOf = t => Math.max(0, ...[T(t.r-1,t.c),T(t.r+1,t.c),T(t.r,t.c-1),T(t.r,t.c+1)].filter(Boolean).map(o => Math.abs((o.h||0)-(t.h||0))));
const drainOf = t => Math.max(0.05, Math.min(1, t.soil.drain + 0.08*(t.h||0) + 0.05*slopeOf(t) - (t.h===0 ? 0.08 : 0)));
const phQ = ph => Math.max(0.7, 1 - 0.14*Math.max(0, Math.abs(ph-6.15)-0.35));
const soilYield = t => (0.55 + 0.5*Math.min(t.soil.nit, 1.1)) * (0.82 + 0.18*Math.min(1, drainOf(t)/0.6)) * (slopeOf(t)>=2 ? 0.92 : 1);
const soilQ = t => phQ(t.soil.ph) * (t.soil.nit > 1.0 ? 1 - (t.soil.nit-1.0)*0.6 : 1);
const careYield = t => t.top===1 ? 1 : t.top===2 ? 0.92 : 0.82;
const careQ = (t, pr) => (t.top===1 ? 1 : t.top===2 ? 0.95 : 0.88) * (pr===2 && t.top!==1 ? 0.93 : 1); // untopped ligero lacks body
const RESIST = { habano:0.4, corojo:1.6, aurelio:0.8 };
function endCrop(t){
  const so = t.soil;
  so.nit = Math.max(0.05, so.nit - 0.3); so.consec++; so.fallow = 0;
  if (so.consec>=2 && drainOf(t)<0.55) so.shank = Math.min(1, so.shank + 0.25);
}
function soilScore(t){ const so = t.soil; return so.shank>0.2 ? 0.2 : phQ(so.ph) * Math.min(1, 0.55+0.5*Math.min(so.nit,1.1)) * (0.7+0.3*drainOf(t)) * (so.nit>1.05?0.85:1); }
const lvl = (x, names) => names[Math.max(0, Math.min(names.length-1, Math.floor(x*names.length)))];

const lastAlert = { worm:-99, mold:-99, shank:-99, top:-99 };
const CARE_PER_HAND = 6;
const boss = () => perk('goodBoss') ? 0.85 : 1;
const topPiece = () => Math.round((perk('topper')?9:12)*boss()), wormPiece = () => Math.round((perk('pestEye')?8:10)*boss());
function fieldTick(){
  const m = curMonth(), cool = [10,11,0,1].includes(m), wetW = wx==='Rain'||wx==='Storm'||wx==='Cloudy';
  let newWorm=0, newMold=0, newShank=0, needTop=0; const seeded = [];
  for (const row of map) for (const t of row){
    const so = t.soil;
    if (t.work==='seeded'){
      if (t.prot>0) t.prot--;
      if (!t.owned) continue;
      seeded.push(t);
      if (t.worm>0){ t.worm = Math.min(1, t.worm+0.035); t.hp = Math.max(0.35, t.hp - t.worm*0.005); }
      else if (t.g>=35 && t.g<=125 && wrnd() < 0.0025*(wetSeason()?1:1.6)){ t.worm = 0.08; newWorm++; }
      if (t.bmold>0){ if (t.prot>0) t.bmold = Math.max(0, t.bmold-0.1); else { t.bmold = Math.min(1, t.bmold + (wetW&&cool?0.07 : wetW?0.03 : 0.01)); t.hp = Math.max(0.25, t.hp - t.bmold*0.01); } }
      else if (cool && wetW && t.g<115 && !(t.prot>0) && wrnd()<0.0012){ t.bmold = 0.06; newMold++; }
      if (t.shankHit) t.hp = Math.max(0.15, t.hp-0.025);
      else if (t.g>=30 && t.g<=120 && so.shank>0.05 && (wx==='Rain'||wx==='Storm') && drainOf(t)<0.6 && wrnd() < so.shank*0.05*(RESIST[t.v]||1)){ t.shankHit = true; newShank++; }
      if (!t.top && t.g>=88) needTop++;
    } else if (t.work==='cover'){
      t.g++; so.nit = Math.min(1.1, so.nit+0.0039); so.shank = Math.max(0, so.shank-0.003);
      if (t.g>=90){ t.work = null; so.consec = 0; so.fallow = 400; }
    } else {
      so.fallow++; so.nit = Math.min(0.95, so.nit+0.0006); if (so.shank>0) so.shank = Math.max(0, so.shank-0.0012); if (so.fallow>300) so.consec = 0;
    }
  }
  const N4 = t => [T(t.r-1,t.c),T(t.r+1,t.c),T(t.r,t.c-1),T(t.r,t.c+1)];
  for (const t of seeded){
    if (t.worm>0.2) for (const nb of N4(t)) if (nb && nb.owned && nb.work==='seeded' && !nb.worm && wrnd()<t.worm*0.03) nb.worm = 0.05;
    if (t.bmold>0.15) for (let dr=-2;dr<=2;dr++) for (let dc=-2;dc<=2;dc++){ const nb=T(t.r+dr,t.c+dc); if (nb && nb!==t && nb.owned && nb.work==='seeded' && !nb.bmold && !(nb.prot>0) && wrnd() < t.bmold*(Math.abs(dr)+Math.abs(dc)<=1?0.12:0.04)) nb.bmold = 0.05; }
  }
  careTick();
  if (newWorm && days-lastAlert.worm>25){ lastAlert.worm = days; (staff.hands?toast:attention)(`Hornworms on ${newWorm} tile${newWorm>1?'s':''}. ${staff.hands?'Your field hands will pick them off.':'Pick them off (Care) before they shred the leaves.'}`); }
  if (newMold && days-lastAlert.mold>20){ lastAlert.mold = days; attention(`Blue mold on ${newMold} tile${newMold>1?'s':''}. It spreads fast in cool, wet weather. Spray it (Care) now.`); }
  if (newShank && days-lastAlert.shank>30){ lastAlert.shank = days; attention(`Black shank: plants are wilting on ${newShank} tile${newShank>1?'s':''}. Nothing saves them this season. Drain and rotate that ground.`); }
  if (needTop && !staff.hands && days-lastAlert.top>15){ lastAlert.top = days; attention(`${needTop} tile${needTop>1?'s are':' is'} flowering. Top & sucker them (Care) so the strength goes into the leaves.`); }
}
function careTick(){
  if (!staff.hands) return;
  let cap = staff.hands*CARE_PER_HAND;
  const tops = map.flat().filter(t => t.owned && t.work==='seeded' && !t.top && t.g>=88).sort((a,b)=>b.g-a.g);
  if (know('flower')) for (const t of tops){ if (cap<=0 || cash<topPiece()) break; t.top = t.g>104?2:1; if (t.g<=97) elder.stats.topOnTime++; cash -= topPiece(); spend('Labor', topPiece()); cap--; t.pick = 2; }
  const worms = map.flat().filter(t => t.owned && t.work==='seeded' && t.worm>0).sort((a,b)=>b.worm-a.worm);
  if (know('pests')) for (const t of worms){ if (cap<=0 || cash<wormPiece()) break; t.worm = 0; cash -= wormPiece(); spend('Labor', wormPiece()); cap--; t.pick = 2; }
}

function tenderSetsVent(b, out, leafMoist){
  const T0 = TENDERS[staff.tender];
  if (wx==='Storm' && wrnd() < T0.stormNap){ b.vent = 'open'; return; }      // asleep in the hammock, doors banging
  if (wrnd() < T0.forget) return;                                             // didn't check today
  const ranked = ['open','half','closed'].map(v => { const k=v==='open'?0.5:v==='half'?0.2:0.04; return [v, Math.abs(b.hum+(out-b.hum)*k+leafMoist-72)]; }).sort((a,c)=>a[1]-c[1]).map(x=>x[0]);

function crewTick(){
  if (!staff.hands) return;
  const ripe = map.flat().filter(t => t.owned && nextPrim(t) && t.g>=nextPrim(t).start).sort((a,c)=>urgency(c)-urgency(a));
  if (!ripe.length){ staff.barnWarned = false; return; }
  const fb = freeBarn();
  if (fb<=0){ if (!staff.barnWarned){ staff.barnWarned = true; attention('Your field hands have stopped picking. The barns are full.'); } return; }
  const n = Math.min(staff.hands*PICK_PER_HAND, ripe.length, fb, Math.floor(cash/pieceRate()));
  if (n<=0){ if (!staff.barnWarned){ staff.barnWarned = true; attention('Your field hands won’t pick without pay. You’re out of cash.'); } return; }
  staff.barnWarned = false;
  const picked = ripe.slice(0,n);

}

  'You cannot do everything yourself, and you should not try. Pickers are easy to find at harvest. Pay them fairly and on time, and they come back next year already knowing your rows.',
  'The barn is different. A good barn man, or woman, watches the sky and sets those doors without being told. They cost more, and they are worth it.',
  'A cheap one will leave the doors open in a storm, and in one night you lose what took four months to grow. I learned that the hard way, in seventy-one.' ]},
 { id:'pilon', need:34, title:'The pilón', body:[
  'After curing, the leaf has to sweat. We stack it in a big pile, the pilón, and it heats up from inside like compost. That heat cooks out the ammonia and the harshness. You can smell it, sharp in your nose.',
  'But heat is a horse you have to hold. I keep a thermometer in the middle. When it climbs past one hundred ten, I turn it: outside leaves go in, inside leaves go out. I never let it reach one hundred fifteen. Burnt leaf tastes like burnt leaf, and no blender can save it.',
  'Three turns at least. The strong top leaves need more. Patience.' ]},
 { id:'time', need:46, title:'Time is the last ingredient', body:[
  'Fermented leaf is good. Aged leaf is better. We pack it in bales, tercios, wrapped in yagua, the bark of the royal palm, and let it sleep. Months, years. It gets smoother, rounder, sweeter.',
  'The trouble is that while it sleeps, nobody pays you. Every young farmer wants to sell everything right away to pay the bills.',
  'My advice: sell your weaker leaf to feed your family, and let your best leaf sleep. One day you will need it, when you make your own cigar.' ]},
 { id:'blend', need:50, title:'The blender’s table', body:[
  'Every leaf you grew is a different spice. The volado makes a cigar burn. The seco gives it its perfume. The ligero gives it strength and slows it down. A blender puts them together like a cook.',
  'Start simple. A wrapper you are proud of, a binder that burns well, and a filler with some seco and a little ligero. Too much ligero and it is heavy, it goes out, and nobody but the old men can smoke it. Too much volado and it smokes like paper.',
  'And let the cigars rest after rolling. A fresh cigar is wet and loud. A few weeks in a cedar room and it quiets down and the flavors marry. Then you smoke one, and you listen to it. And then you listen to the people who buy it.' ]},
 { id:'buyer', need:58, title:'The buyer’s eyes', body:[
  'The factory buyer has seen a thousand farmers. He looks at color, texture and smell, and at whether the leaf is the same from bale to bale.',
  'Mix bad leaf into good leaf one time, and he remembers forever. Be honest about your grades. The farmer who sells steady leaf every year gets better prices than the one who sells great leaf one year and poor leaf the next.',
  'A reputation is slow to build and fast to lose. That is true of people too, not only leaf.' ]},
 { id:'storms', need:70, title:'Storms and the sea', body:[
  'Here the rains come from May to October, and the hurricanes can come from June to November, the worst usually from August to October. That is why we plant in the fall, after the heavy rains, and harvest in the dry months.',
  'A big storm can flatten a field in one night. You cannot stop the wind. But you can spread your risk: not all your money in one field, a little saved, a barn built to last.',
  'And when the neighbor’s roof blows off, you go help him. Next year it will be yours.' ]},
 { id:'promise', need:84, title:'A cigar is a promise', body:[
  'A cigar is three things. The filler is the heart, a mix of leaves from different primings, sometimes from different farms. The binder holds it together. The wrapper is the face, the most beautiful leaf, grown thin and perfect, often under cloth.',
  'A good blender is like a cook who knows every ingredient. When you sell leaf, the factory makes the promise to the smoker. When you make your own cigar, your name is on the band, and the promise is yours.',
  'Do not make that promise until your leaf can keep it.' ]},
 { id:'gift', need:100, title:'What the land gives back', body:[
  'My son lives in the city now. He sends money and calls on Sundays. He never wanted this life, and I do not blame him. It is hard.',
  'But I have watched you, up before the sun, back to the barn at night when the rain started. You have it in your hands now.',
  'Take this. It is seed from my father’s Criollo, saved every year since before I was born. It knows this valley better than any seed in a store. Plant it, save it, and pass it on. That is all this life is: something you were given, and something you give.' ], reward:true },
];

// ---------- mini-games ----------
let gameTimer = null;
const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function stopGame(){ if (gameTimer){ clearInterval(gameTimer); gameTimer = null; } elder.game = null; }
function startGame(kind){
  stopGame();
  if (kind==='leaf') elder.game = { kind, round:0, score:0, rounds:leafRounds(), msg:'' };
  if (kind==='enemy') elder.game = { kind, round:0, score:0, rounds:shuffle(['worm','mold','shank']), msg:'' };
  if (kind==='barn'){ const wxs = shuffle(['Sunny','Sunny','Rain','Rain','Cloudy','Sunny','Rain']); elder.game = { kind, day:0, hum:74, wxs, log:[], msg:'Day 1. Look at the sky and set the doors.' }; }
  if (kind==='pilon'){ elder.game = { kind, temp:86, heat:0, turns:0, early:0, scorch:0, over:false, msg:'The pile is warming up. Watch the thermometer.' };
    gameTimer = setInterval(() => { const g = elder.game; if (!g || g.kind!=='pilon' || g.over) return;
      g.temp += 0.6 + 0.6*Math.random() + g.heat/1400; g.heat += Math.max(0, g.temp-82)/4;
      if (g.temp > 115){ g.scorch++; g.msg = '“It’s burning! Turn it!”'; }
      if (g.scorch >= 4) endGame(false, '“Smell that? Burnt. The whole middle of the pile is cooked. Again.”');
      else if (g.heat >= 300 && g.turns >= 3) endGame(g.early<=1, g.early<=1 ? '“Good. You held the horse.”' : '“It’s done, but you turned it too early, too often. You let the heat go to waste.”');
      renderElder(); }, 250); }
  renderElder();
}
function endGame(win, msg){
  const g = elder.game; g.over = true; g.win = win; g.msg = msg; if (gameTimer){ clearInterval(gameTimer); gameTimer = null; }
  if (win){ const id = Object.keys(MISSIONS).find(k => MISSIONS[k].game===g.kind); completeMission(id); }
}
function gameInput(v){
  const g = elder.game; if (!g || g.over){ if (v==='again') startGame(g.kind); if (v==='back'){ stopGame(); renderElder(); } return; }
  if (g.kind==='leaf'){ const R = g.rounds[g.round], pick = R.opts[+v].kind, ok = pick===R.target; if (ok) g.score++;
    g.msg = ok ? LEAF_RIGHT[R.target] : `${LEAF_WRONG[pick]} ${LEAF_HINT[R.target]}`;
    g.round++; if (g.round>=g.rounds.length) endGame(g.score>=g.rounds.length-1, g.score>=g.rounds.length-1 ? `“${g.score} of ${g.rounds.length}. You have the eye.”` : `“${g.score} of ${g.rounds.length}. Look again, with the sun behind you.”`); }
  if (g.kind==='enemy'){ const ans = g.rounds[g.round], ok = v===ans; if (ok) g.score++;
    const name = { worm:'hornworms', mold:'blue mold', shank:'black shank', drought:'lack of water' };
    g.msg = ok ? `“Yes, ${name[ans]}.”` : `“No. That is ${name[ans]}. ${ans==='worm'?'See the holes and the droppings?':ans==='mold'?'Look under the leaf: gray-blue.':'The stalk is black at the bottom.'}”`;
    g.round++; if (g.round>=3) endGame(g.score===3, g.score===3 ? '“You know your enemies now.”' : '“Learn them. They will not wait for you to learn.”'); }
  if (g.kind==='barn'){ const out = WX[g.wxs[g.day]].hum, k = v==='open'?0.5 : v==='half'?0.2 : 0.04;
    g.hum = Math.max(40, Math.min(99, g.hum + (out-g.hum)*k + 0.6)); const good = g.hum>=65 && g.hum<=80; g.log.push({ w:g.wxs[g.day], v, hum:g.hum, good });
    g.msg = good ? '“Good. The leaf is happy.”' : g.hum>80 ? '“Too wet. When the rain comes, close the doors.”' : '“Too dry. On a hot, sunny day, hold the moisture in.”';
    g.day++; if (g.day>=7){ const n = g.log.filter(x=>x.good).length; endGame(n>=6, n>=6 ? `“${n} good days of 7. You can watch my barn any time.”` : `“${n} good days of 7. The leaf noticed.”`); } }
  if (g.kind==='pilon'){ if (g.temp < 104){ g.early++; g.msg = '“Too early. You are letting the heat out before it does its work.”'; } else g.msg = g.temp>115 ? '“Late, but turned.”' : '“Good, right on time.”';
    g.temp = 85 + Math.random()*2; g.turns++; }
  renderElder();

const LEAF_Q = [
  { q:'“Which of these would you pick today?”', target:'ripe', pool:['young','almost','over','starved'] },
  { q:'“Which one did somebody leave in the field too long?”', target:'over', pool:['young','almost','ripe','starved'] },
  { q:'“Which one needs at least another two weeks?”', target:'young', pool:['ripe','over','starved'] },
  { q:'“One of these plants is hungry. Which leaf tells you?”', target:'starved', pool:['ripe','almost','young'] },
  { q:'“Which one came from the top of the plant, the ligero?”', target:'ligero', pool:['volado','seco'] },
  { q:'“Which one is volado, from the bottom of the plant?”', target:'volado', pool:['seco','ligero'] },
];
const LEAF_RIGHT = { ripe:'“Yes. See how it lightens, and the yellow at the edges?”', over:'“Yes. Brown, thin, papery. Too late.”', young:'“Yes. Deep green all over. It is still growing.”', starved:'“Yes. Pale all over, small and thin. That is hunger, not ripeness.”', ligero:'“Yes. Small, thick, dark and oily. It saw the most sun.”', volado:'“Yes. Big, thin and pale. It lived in the shade of the others.”' };
const LEAF_WRONG = { ripe:'“No, that one is ripe.”', over:'“No, that one went past its best.”', young:'“No, that one is still too green.”', almost:'“No, that one is close, but not there yet.”', starved:'“No, that pale one is starving for nitrogen. Yellow all over is hunger, not ripeness.”', ligero:'“No, that is ligero, from the top.”', volado:'“No, that is volado, from the bottom.”', seco:'“No, that is seco, from the middle.”' };
const LEAF_HINT = { ripe:'Ripe leaf lightens and yellows at the edges.', over:'Look for brown and papery.', young:'Look for the deepest green.', starved:'Hunger shows as pale yellow all over, on a small leaf.', ligero:'Ligero is the smallest and thickest, dark and glossy.', volado:'Volado is the biggest and thinnest, and pale.' };
function leafRounds(){
  return shuffle([...LEAF_Q]).slice(0,4).map(Q => {
    const kinds = shuffle([Q.target, ...shuffle([...Q.pool]).slice(0, Math.min(3, Q.pool.length))]);
    return { q:Q.q, target:Q.target, opts: kinds.map(kind => ({ kind, s:0.86+Math.random()*0.2, w:0.85+Math.random()*0.3, rot:(Math.random()-0.5)*28, j:Math.random() })) };
  });
}
function leafSVG(kind, o){
  o = o || { s:1, w:1, rot:0, j:0.5 };
  const P = { young:['#3f8a3a','#2f6a2a'], almost:['#69a54a','#4f8a36'], ripe:['#bfc455','#e3c94a'], over:['#a9783a','#6e4a22'], starved:['#d8d58a','#b9b46a'], volado:['#7fb35a','#5f9442'], seco:['#5f9e44','#3f7a30'], ligero:['#3c7a32','#244f1e'] }[kind];
  const fill = mix(P[0], o.j>0.5 ? '#ffffff' : '#000000', Math.abs(o.j-0.5)*0.12), edge = P[1];
  const size = { volado:1.08, seco:0.96, ligero:0.78, starved:0.8 }[kind] || 1, wide = { volado:1.15, ligero:0.85, starved:0.8 }[kind] || 1;
  const sx = o.w*wide, sc = o.s*size;
  const path = kind==='over' ? 'M50 8 C80 26 84 60 56 108 C50 112 40 104 34 96 C16 60 22 24 50 8Z' : 'M50 6 C78 22 86 58 50 114 C14 58 22 22 50 6Z';
  let extra = '';
  if (kind==='ripe') extra = '<circle cx="40" cy="50" r="3" fill="#d9d27a"/><circle cx="60" cy="72" r="2.5" fill="#d9d27a"/>';
  if (kind==='over') extra = '<circle cx="44" cy="44" r="3" fill="#5e3a1c"/><circle cx="58" cy="66" r="4" fill="#5e3a1c"/><path d="M70 40 L76 46" stroke="#5e3a1c" stroke-width="2"/>';

function chart(o){

const kpi = (label, val, sub, cls) => `<div class="kpi${cls?' '+cls:''}"><div class="kl">${label}</div><div class="kv">${val}</div>${sub?`<div class="ks">${sub}</div>`:''}</div>`;

  let h = `<h3>${TNAME[t.t]}</h3><div class="row"><span>Owner</span><span>${owner}</span></div>`;

    if (t.g >= 90) PRIM.forEach((P0,i) => { const done = (t.pr||0)>i, d = Math.ceil(P0.start - t.g), past = t.g > P0.start+WINDOW;
      h += `<div class="row"><span>${P0.name}</span><span>${done?'Picked':d>0?`Ripe in ${d} days`:past?'<span class="bad">Past its best</span>':'<span class="ok">Ready to pick</span>'}</span></div>`; });
    h += `<div class="row"><span>Topping</span><span>${t.top===1?'Topped & suckered':t.top===2?'Topped late':t.g>=88?'<span class="bad">Flowering, needs topping</span>':'Not yet'}</span></div>`;
    if (t.worm>0) h += `<div class="row"><span>Hornworms</span><span class="bad">${lvl(t.worm,['a few','many','swarming'])}</span></div>`;

function soilRows(t){
  const lie = `<div class="row"><span>Lie of the land</span><span>${['Valley floor','Low ground','Hillside','Hilltop'][t.h||0]}${slopeOf(t)>=2?', steep':slopeOf(t)?', sloping':''}</span></div>`;
  if (!t.tested) return lie + `<div class="row"><span>Soil</span><span class="muted">${t.owned||forSale(t)?'Untested':'Unknown'}</span></div>`;
  const so = t.soil, ph = so.ph, phTxt = ph<5.6?'too acid':ph>6.7?'too alkaline':'good';
  const nTxt = so.nit>1.05?'<span class="bad">too high</span>':so.nit<0.4?'<span class="bad">low</span>':so.nit<0.7?'moderate':'good';
  const dr = drainOf(t), dTxt = dr<0.45?'<span class="bad">poor</span>':dr<0.7?'fair':'good';
  return lie + `<div class="row"><span>Soil pH</span><span>${ph.toFixed(1)} · ${phTxt==='good'?'good':`<span class="bad">${phTxt}</span>`}</span></div><div class="row"><span>Nitrogen</span><span>${nTxt}</span></div><div class="row"><span>Drainage</span><span>${dTxt}</span></div><div class="row"><span>Black shank</span><span>${so.shank>0.05?'<span class="bad">present in the soil</span>':'none found'}</span></div>${so.consec>=2?`<div class="row"><span>Tobacco crops in a row</span><span class="bad">${so.consec}</span></div>`:''}`;
}

// ================= simulation: daily =================
function dailyTick(){
  weatherTick();
  const out = WX[wx].hum - (wetSeason()?0:5);
  for (const b of buildings){
    if (!b.owned || b.built) continue;
    b.prog++; if (b.prog >= BTYPES[b.type].days){ b.built = true; attention(`Your ${BTYPES[b.type].name.toLowerCase()} is finished.`); }
  }
  staffTick();
  for (const b of ready('barn')){
    const curing = lots.filter(l => l.loc===b.id && l.stage==='curing');
    const leafMoist = curing.length ? 0.6 : 0;
    if (staff.tender) tenderSetsVent(b, out, leafMoist);
    const k = b.vent==='open'?0.5 : b.vent==='half'?0.2 : 0.04;
    b.hum += (out - b.hum)*k + leafMoist + (wrnd()-0.5)*2;
    b.hum = Math.max(35, Math.min(99, b.hum));
    if (curing.length){
      const off = b.hum>80 ? 'damp' : b.hum<62 ? 'dry' : '';
      if (off){ b.offDays = (b.offDays||0)+1; if (b.offDays===3) attention(`The ${bName(b).toLowerCase()} is too ${off} (${Math.round(b.hum)}%). ${off==='damp'?'Close the vents in rain and open them on dry days.':'Close the vents to hold moisture in.'}`); }
      else b.offDays = 0;
    }
    for (const l of curing){
      l.cd++;
      const ideal = b.hum>=65 && b.hum<=80, near = b.hum>=60 && b.hum<=85;
      l.score += ideal?1 : near?0.55 : 0.15;
      if (b.hum>88){ l.mold += PRIM[l.pr].mold; if (l.mold>=3 && !l.moldWarned){ l.moldWarned = true; attention(`Mold is showing on ${lotName(l)} in the ${bName(b).toLowerCase()}. Open the vents.`); } }
      if (l.cd >= PRIM[l.pr].cure){
        l.stage = 'cured';
        const cf = 0.65 + 0.35*(l.score/PRIM[l.pr].cure);
        l.q = Math.max(0.35, l.q*cf*(1-Math.min(0.45,l.mold*0.04)));
        year.grades.push(grade(l.q)); if (['A+','A'].includes(grade(l.q)) && !elder.stats.primA.includes(l.pr)) elder.stats.primA.push(l.pr); attention(`${lotName(l)} has finished curing: grade ${grade(l.q)}.`);
      }
    }
  }
  for (const f of ready('ferm')) for (const pid of f.piles){
    const l = lots.find(x=>x.id===pid); if (!l || l.stage!=='fermenting') continue;
    l.temp += 2.0 + 1.6*wrnd();
    l.heat += Math.max(0, l.temp-82);
    if (l.temp>115) l.scorch++;
    if (l.temp>=108 && !l.hotWarned){ l.hotWarned = true; attention(`Pilón temperature for ${lotName(l)} is ${Math.round(l.temp)}°F. Turn the pile soon.`); }
    if (l.heat>=PRIM[l.pr].heat && l.turns>=PRIM[l.pr].turns){
      l.stage = 'fermented';
      l.q = Math.max(0.35, l.q*Math.max(0.6, 1.12 + (perk('pilonHands')?0.03:0) - 0.035*l.scorch));
      attention(`${lotName(l)} has finished fermenting: grade ${grade(l.q)}.`);
    }
  }
  for (const l of lots) if (l.stage==='baled') l.age++;
  const ripeBy = [0,0,0];
  for (const row of map) for (const t of row){ const P0 = nextPrim(t); if (t.owned && P0 && t.g>=P0.start && (t.seen??-1) < (t.pr||0)){ t.seen = t.pr||0; ripeBy[t.pr||0]++; } }
  const ripeNow = ripeBy[0], laterRipe = ripeBy[1]+ripeBy[2];
  for (const row of map) for (const t of row) if (t.pick>0) t.pick--;
  crewTick();
  if (ripeNow && staff.hands>0) toast(`The volado is ripe on ${ripeNow} tile${ripeNow>1?'s':''}. Your field hands are starting the first pass.`);
  else if (ripeNow){ attention(`The volado (bottom leaves) is ripe on ${ripeNow} tile${ripeNow>1?'s':''}. Each priming keeps its quality for about four weeks. Seco and ligero follow over the next few weeks.`); }
  if (laterRipe && !staff.hands){ const which = ripeBy[2]?'ligero':'seco'; attention(`The ${which} is ready on ${laterRipe} tile${laterRipe>1?'s':''}. Time for the next pass.`); }
  if (wx==='Rain' && wetSeason()) for (const row of map) for (const t of row) if (t.work==='seeded') t.g += 0.15; // rain-fed bonus
  fieldTick(); businessTick(); peopleTick(); aurelioTick();
  const dnow = new Date(Date.UTC(2025,9,1) + dayInt*864e5);
  if (dnow.getUTCMonth()===7 && dnow.getUTCDate()===1 && know('storms') && cash>=1500) elder.stats.stormReady = 1;
  if (debt>0 && dayInt%30===0){ const i = Math.round(debt*0.01); if (cash>=i) cash -= i; else debt += i; spend('Interest', i); }
  checkMissions(); markDirty();
  if (dayInt>0 && dayInt%365===0){ showYearReview(); saveGame(false); }
}

const r3 = x => Math.round((x||0)*1000)/1000;
function serialize(){
  const tiles = map.flat().map(t => [t.t, t.owned?1:0, t.work||0, r3(t.g), t.v||0, r3(t.hp??1), t.pr||0, t.seen??-1, t.top||0, r3(t.worm), r3(t.bmold), t.prot||0, t.shankHit?1:0, t.pick||0, r3(t.tested), t.b||0, t.price, r3(t.soil.ph), r3(t.soil.nit), r3(t.soil.drain), r3(t.soil.shank), t.soil.consec, Math.min(9999, Math.round(t.soil.fallow))]);

async function storeInit(){

// ================= drawing helpers =================
function hexToRgb(hex){ const n=parseInt(hex.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function hexMul(hex, k){ const [r,g,b]=hexToRgb(hex); return `rgb(${Math.min(255,r*k)|0},${Math.min(255,g*k)|0},${Math.min(255,b*k)|0})`; }
function mix(a,b,t){ t=Math.max(0,Math.min(1,t)); const A=hexToRgb(a),B=hexToRgb(b); return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join(''); }
function diamondPath(x,y,s=1){ const w=TW/2*s, h=TH/2*s, cy=y+TH/2; ctx.beginPath(); ctx.moveTo(x,cy-h); ctx.lineTo(x+w,cy); ctx.lineTo(x,cy+h); ctx.lineTo(x-w,cy); ctx.closePath(); }
function poly(pts, fill, stroke, lw){ ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y); ctx.closePath(); if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();} }
function ell(x,y,rx,ry,fill){ ctx.beginPath(); ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,Math.PI*2); ctx.fillStyle=fill; ctx.fill(); }

const bigDiamond = e => [iso(-e,-e), iso(N+e,-e), iso(N+e,N+e), iso(-e,N+e)];

function drawCliffs(t){

}

  if (t.work) col = t.work==='stalks' ? '#9a6a3f' : t.work==='cover' ? '#7d5a36' : '#8d5d36';
  diamondPath(x,y); ctx.fillStyle = hexMul(col, t.t==='water'?1:0.94+0.12*t.n); ctx.fill();
  const P = (u,v) => iso(t.c+u, t.r+v);

    for (let i=1;i<=4;i++){ const v=i/5, a=P(0.06,v), b=P(0.94,v); line(a.x,a.y,b.x,b.y,'#6a4021',1.8); line(a.x,a.y-1.2,b.x,b.y-1.2,'rgba(196,140,86,0.7)',0.8); }

    for (let i=0;i<2;i++){ const q=P(0.3+0.4*i, 0.5+0.15*Math.sin(ph+i)); ctx.beginPath(); ctx.moveTo(q.x-6,q.y); ctx.quadraticCurveTo(q.x,q.y-2.5,q.x+6,q.y); ctx.stroke(); }

    if (t.r===13 && t.c>4) for (const v of [0.35,0.65]){ const a=P(0.02,v), b=P(0.98,v); line(a.x,a.y,b.x,b.y,'rgba(140,100,50,0.35)',1.4); }
  } else if (t.t==='town'){
    for (let i=0;i<6;i++){ const q=P((t.n*3.7+i*0.31)%0.85+0.08,(t.n2*2.9+i*0.47)%0.85+0.08); ell(q.x,q.y,2.2,1.1,'rgba(150,120,80,0.35)'); }
  } else if (t.t==='field'){

    const s = fp(L,B,0.5,0); const sx=s.x-10, sy=s.y+12;
    line(sx,sy,sx,sy-14,'#5b3517',1.6); ctx.fillStyle='#f2c14e'; ctx.fillRect(sx-12,sy-22,26,10); ctx.strokeStyle='#5b3517'; ctx.lineWidth=1; ctx.strokeRect(sx-12,sy-22,26,10);
    ctx.fillStyle='#3b2410'; ctx.font='800 6.5px Nunito, sans-serif'; ctx.textAlign='center'; ctx.fillText('FOR SALE', sx+1, sy-14.6);
  }
}

function drawObjects(t){
  const P=(u,v)=>iso(t.c+u,t.r+v);
  if (t.b){ const b=Bid(t.b); if (t.c===b.c+b.w-1 && t.r===b.r+b.h-1) building(b, lookOf(b)); return; }
  if (t.work==='seeded'){
    const s = stageOf(t.g), pts = [];
    for (let i=0;i<3;i++) for (let j=0;j<3;j++) pts.push([0.2+0.3*j, 0.2+0.3*i, ((i*3+j)*0.137+t.n)%1]);
    pts.sort((a,b)=>(a[0]+a[1])-(b[0]+b[1]));
    const fx = { top:t.top, worm:t.worm||0, mold:t.bmold||0, wilt:t.shankHit };
    for (const [u,v,nn] of pts){ const q=P(u,v); drawPlant(q.x,q.y,s,t.v,nn,t.hp,t.pr,t.g,fx); }
    if (t.pick>0){ const q=P(0.5+0.12*Math.sin(time*0.7+t.n*5),0.62); person(q.x,q.y,'#4f7fa8',time*6,null); }
    return;
  }
  if (t.pick>0){ for (let i=0;i<2;i++){ const q=P(0.3+0.4*i+0.08*Math.sin(time*0.8+i*2+t.n*5), 0.45+0.25*i); person(q.x,q.y, i?'#e8e2d0':'#4f7fa8', time*6+i*1.7, i?null:'#7fb04e'); } }
  if (t.work==='stalks' && !(t.pick>0)){ for (let i=0;i<3;i++) for (let j=0;j<3;j++){ const q=P(0.2+0.3*j,0.2+0.3*i); drawStalk(q.x,q.y,((i+j)*0.3+t.n)%1); } return; }
  if (t.work==='cover'){ const sz = Math.min(1, 0.3 + t.g/60); for (let i=0;i<3;i++) for (let j=0;j<3;j++){ const q=P(0.18+0.32*j,0.18+0.32*i); ell(q.x+1,q.y,5*sz,2*sz,'rgba(30,40,10,0.2)'); ell(q.x-2*sz,q.y-2*sz,3.4*sz,2.4*sz,'#5d9a3a'); ell(q.x+2*sz,q.y-2.4*sz,3.4*sz,2.4*sz,'#6dab45'); ell(q.x,q.y-4*sz,2.8*sz,2*sz,'#7fbd52'); } return; }
  if (t.work) return;
  if (t.t==='forest'){
    const q1=P(0.3,0.35), q2=P(0.7,0.65);
    if (t.n<0.45){ palm(q1.x,q1.y,32+8*t.n2,t.n); broadTree(q2.x,q2.y,0.9); }
    else { broadTree(q1.x,q1.y,0.85+0.2*t.n2); if (t.n2>0.4) palm(q2.x,q2.y,30+10*t.n,t.n2); else broadTree(q2.x,q2.y,0.95); }
  } else if (t.t==='scrub'){
    const q1=P(0.3,0.4), q2=P(0.68,0.62), q3=P(0.55,0.25); bush(q3.x,q3.y); bush(q1.x,q1.y); bush(q2.x,q2.y);
  } else if (t.t==='grass' && t.n>0.93 && !t.owned && !t.neighbor){ const q=P(0.5,0.5); palm(q.x,q.y,30,t.n2); }
}
const up = t => -(t.h||0)*ELEV;
function drawFences(){
  ctx.lineCap='round';
  for (const row of map) for (const t of row){
    if (!t.owned) continue;
    const p0=iso(t.c,t.r), p={x:p0.x, y:p0.y+up(t)}, Tp={x:p.x,y:p.y}, R={x:p.x+TW/2,y:p.y+TH/2}, B={x:p.x,y:p.y+TH}, L={x:p.x-TW/2,y:p.y+TH/2};
    for (const [nb,a,b] of [[T(t.r-1,t.c),Tp,R],[T(t.r,t.c-1),Tp,L],[T(t.r+1,t.c),L,B],[T(t.r,t.c+1),R,B]]){
      if (nb && nb.owned) continue;
      line(a.x,a.y,b.x,b.y,'rgba(255,244,200,0.95)',2.2); line(a.x,a.y+1.6,b.x,b.y+1.6,'rgba(90,55,20,0.45)',1);
      for (const q of [a,b,{x:(a.x+b.x)/2,y:(a.y+b.y)/2}]) ell(q.x,q.y,1.8,1.8,'#7a4b25');
    }
  }
  ctx.lineCap='butt';
}
function drawSelection(){
  if (sel){
    const actSet = new Set(sel.act), eligSet = new Set(sel.elig);
    for (let r=sel.r0;r<=sel.r1;r++) for (let c=sel.c0;c<=sel.c1;c++){
      const t=map[r][c]; if (eligSet.has(t)) continue;
      const p=iso(c,r); diamondPath(p.x,p.y+up(t),0.92); ctx.fillStyle='rgba(220,60,40,0.18)'; ctx.fill();
    }
    for (const t of sel.elig){ const p=iso(t.c,t.r); diamondPath(p.x,p.y+up(t),0.92); ctx.fillStyle = actSet.has(t)?'rgba(150,255,110,0.45)':'rgba(255,190,80,0.45)'; ctx.fill(); }
  }
  if (tool==='build' && hover && !pan){
    const fp = footprint(hover), bad = canPlace(fp) || BTYPES[btype].cost>cash;
    for (const t of fp) if (t){ const p=iso(t.c,t.r); diamondPath(p.x,p.y+up(t),0.94); ctx.fillStyle = bad?'rgba(220,60,40,0.35)':'rgba(150,255,110,0.42)'; ctx.fill(); }
  }
}
function drawGhost(){
  if (tool!=='build' || !hover || pan) return;
  const fp = footprint(hover); if (canPlace(fp)) return;
  ctx.save(); ctx.translate(0, up(hover)); ctx.globalAlpha = 0.55; building({ c:hover.c, r:hover.r, w:BTYPES[btype].w, h:BTYPES[btype].h, type:btype, built:true, id:-1, piles:[0,0] }, LOOK[btype], true); ctx.globalAlpha = 1; ctx.restore();
}
function drawSelectionOutline(){
  if (!sel) return;
  ctx.setLineDash([6,4]); ctx.lineDashOffset = -time*20;
  poly([iso(sel.c0,sel.r0),iso(sel.c1+1,sel.r0),iso(sel.c1+1,sel.r1+1),iso(sel.c0,sel.r1+1)],null,'rgba(255,255,255,0.95)',2.2/cam.z); ctx.setLineDash([]);
}
function drawHover(){
  if (!hover || drag || pan || tool==='build') return;
  const p=iso(hover.c,hover.r); diamondPath(p.x,p.y+up(hover),0.96);
  if (tool!=='inspect' && eligible(tool,hover)){ ctx.fillStyle='rgba(150,255,110,0.3)'; ctx.fill(); }
  ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=1.6/cam.z; ctx.stroke();
}
function drawForSaleTint(){
  if (tool!=='buy') return;
  for (const row of map) for (const t of row){ if (!forSale(t)) continue; const p=iso(t.c,t.r); diamondPath(p.x,p.y+up(t),0.9); ctx.fillStyle='rgba(255,230,120,0.16)'; ctx.fill(); }
}
function drawSoilOverlay(){
  if (tool!=='soil') return;
  for (const row of map) for (const t of row){
    if (!(t.owned || forSale(t)) || t.b || !PLANT_T.concat(['scrub','forest']).includes(t.t)) continue;
    const p = iso(t.c,t.r); diamondPath(p.x,p.y+up(t),0.86);
    if (!t.tested){ ctx.fillStyle='rgba(90,80,70,0.22)'; ctx.fill(); continue; }
    const sc = soilScore(t);
    ctx.fillStyle = sc>=0.88?'rgba(90,200,70,0.45)': sc>=0.74?'rgba(200,210,70,0.45)': sc>=0.6?'rgba(240,160,60,0.45)':'rgba(220,60,40,0.45)'; ctx.fill();
  }
}
function drawGrid(){
  if (tool==='inspect') return;
  ctx.strokeStyle='rgba(0,0,0,0.08)'; ctx.lineWidth=1/cam.z; ctx.beginPath();
  for (const row of map) for (const t of row){ const p=iso(t.c,t.r), y=p.y+up(t); ctx.moveTo(p.x,y); ctx.lineTo(p.x+TW/2,y+TH/2); ctx.lineTo(p.x,y+TH); ctx.lineTo(p.x-TW/2,y+TH/2); ctx.closePath(); }
  ctx.stroke();
}
function drawFloats(dt){
  ctx.font='800 15px Nunito, sans-serif'; ctx.textAlign='center';
  for (let i=floats.length-1;i>=0;i--){
    const f=floats[i]; f.t+=dt; if (f.t>1.6){ floats.splice(i,1); continue; }
    ctx.globalAlpha = Math.min(1, 2*(1.6-f.t)); const y=f.y-f.t*26;
    ctx.lineWidth=4; ctx.strokeStyle='#5b3517'; ctx.strokeText(f.text,f.x,y); ctx.fillStyle='#ffe08a'; ctx.fillText(f.text,f.x,y);
  }
  ctx.globalAlpha=1;
}
// weather overlay (screen space)
const drops = Array.from({length:320}, () => ({ x:Math.random(), y:Math.random(), s:0.6+Math.random()*0.6 }));
let flash = 0, cloudT = 0;
function drawWeather(dt){
  const raining = wx==='Rain'||wx==='Storm', storm = wx==='Storm';
  const target = storm?0.32 : raining?0.2 : wx==='Cloudy'?0.08 : 0;
  cloudT += (target-cloudT)*Math.min(1,dt*1.5);
  if (cloudT>0.005){ ctx.fillStyle=`rgba(40,55,70,${cloudT})`; ctx.fillRect(0,0,W,H); }
  if (raining){
    const n = storm?320:170; ctx.strokeStyle = 'rgba(210,230,245,0.55)'; ctx.lineWidth = 1.2; ctx.beginPath();
    for (let i=0;i<n;i++){ const d=drops[i]; d.y += dt*(storm?1.6:1.1)*d.s; d.x += dt*(storm?0.25:0.08); if (d.y>1){ d.y-=1; d.x=Math.random(); } if (d.x>1) d.x-=1;
      const x=d.x*W, y=d.y*H; ctx.moveTo(x,y); ctx.lineTo(x-(storm?5:2), y-14*d.s); }
    ctx.stroke();
    if (storm && Math.random()<dt*0.25) flash = 1;
  }
  if (flash>0){ ctx.fillStyle=`rgba(255,255,240,${flash*0.45})`; ctx.fillRect(0,0,W,H); flash -= dt*3; }
}

// ================= loop =================
let last = performance.now(), opsTimer = 0;
function frame(now){
  try { step(now); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
function step(now){
  const dt = Math.min(0.05,(now-last)/1000); last = now; time += dt;
  const dd = dt*SPEEDS[speedIdx]; days += dd;
  if (dd>0) for (const row of map) for (const t of row) if (t.work==='seeded') t.g = Math.min(175, t.g + dd*(0.9+0.2*t.n));
  while (dayInt < Math.floor(days)){ dayInt++; dailyTick(); }
  $('date').textContent = dateStr(); updateWeatherHUD();
  if (drag) updateSel();
  updateInfo();
  opsTimer += dt; if (opsTimer>0.25){ opsTimer=0; renderOps(false); $('cash').textContent = fmt(cash); }
  if (gameId && dirty && !saving && now - lastSaveReal > 60000) saveGame(false);
  sceneTimer += dt; if (scene && sceneTimer > 1.2 && speedIdx){ sceneTimer = 0; renderScene(); }

  ctx.setTransform(DPR,0,0,DPR,0,0); drawSea();
  ctx.setTransform(DPR*cam.z,0,0,DPR*cam.z,DPR*cam.x,DPR*cam.y);
  poly(bigDiamond(2.2),'rgba(120,220,215,0.55)'); poly(bigDiamond(1.2),'rgba(150,232,220,0.6)'); poly(bigDiamond(0.55),'#ead49a');
  const lift = (t, fn) => { const h = t.h||0; if (h) { ctx.save(); ctx.translate(0, -h*ELEV); fn(t); ctx.restore(); } else fn(t); };
  for (const row of map) for (const t of row) if (t.r===N-1||t.c===N-1) lift(t, drawEdgeFaces);
  const vis = (t, up) => { const p=iso(t.c,t.r), sx=cam.x+p.x*cam.z, sy=cam.y+p.y*cam.z; return sx>-TW*cam.z && sx<W+TW*cam.z && sy>-TH*cam.z && sy<H+up*cam.z; };
  for (let d=0; d<=2*N-2; d++) for (let r=0;r<N;r++){ const c=d-r; if (c>=0&&c<N && vis(map[r][c],40)) lift(map[r][c], drawGround); }
  drawGrid(); drawForSaleTint(); drawSoilOverlay(); drawSelection(); drawFences(); drawHover();
  for (let d=0; d<=2*N-2; d++) for (let r=0;r<N;r++){ const c=d-r; if (c>=0&&c<N && vis(map[r][c],120)) lift(map[r][c], drawObjects); }
  drawGhost(); drawFloats(dt);
  ctx.setTransform(DPR,0,0,DPR,0,0); drawWeather(dt);
}
window.addEventListener('resize', resize);
resize(); initCam(); setTool('inspect'); refreshUI(); updateWeatherHUD(); setSpeed(0);
requestAnimationFrame(frame);
renderMenu(); storeInit().then(renderMenu);
})();
</script>
