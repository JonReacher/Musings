<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14231e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Packers">
<title>Green Bay Packers Gameday</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pk-green:#203731; --pk-gold:#FFB612;
  --night:#101b17; --panel:#17261f; --panel-2:#1d2f27; --line:rgba(243,245,239,.10);
  --chalk:#f3f5ef; --muted:rgba(243,245,239,.62); --faint:rgba(243,245,239,.38);
  --los:#4aa8ff; --fd:#f5e14a; --red:#ff5a4e;
  --opp:#4f2683; --opp-ink:#fff;
  --cond:"Barlow Condensed",system-ui,sans-serif; --body:"Barlow",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--night);color:var(--chalk);font-family:var(--body);font-size:15px;line-height:1.4;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(env(safe-area-inset-bottom) + 24px) env(safe-area-inset-left);
  background-image:linear-gradient(180deg,var(--pk-green) 0,var(--night) 340px)}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
.num{font-family:var(--cond);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pk-gold);outline-offset:2px}

/* masthead */
.mast{display:flex;align-items:center;gap:10px;padding:10px 0 10px}
.mast h1{font-family:var(--cond);font-weight:800;font-size:25px;line-height:1;letter-spacing:.01em;color:var(--pk-gold)}
.mast .st{font-size:13px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(255,90,78,.6);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 7px rgba(255,90,78,0)}100%{box-shadow:0 0 0 0 rgba(255,90,78,0)}}

/* logo slots: drop real logo files in, monogram shows until then */
.logo{--sz:48px;width:var(--sz);height:var(--sz);flex:0 0 var(--sz);border-radius:50%;position:relative;display:grid;place-items:center;
  background:var(--tc,#444);color:var(--ti,#fff);font-family:var(--cond);font-weight:800;font-size:calc(var(--sz)*.4);letter-spacing:.02em;
  box-shadow:inset 0 0 0 2px var(--tr,rgba(255,255,255,.85))}
.logo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:50%;background:var(--night)}
.logo.has-img{box-shadow:none;background:transparent}
.logo.has-img b{visibility:hidden}

/* scorebug */
.bug{background:var(--panel);border-radius:18px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.bug-top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 16px;background:rgba(0,0,0,.28)}
.bug-top .per{font-size:15px;font-weight:600;color:var(--muted)}
.bug-top .clk{font-family:var(--cond);font-weight:700;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.bug-top .fin{font-family:var(--cond);font-weight:800;font-size:26px;line-height:1;color:var(--pk-gold)}
.trow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:9px 16px;border-top:1px solid var(--line)}
.trow.gb{background:linear-gradient(90deg,rgba(255,182,18,.12),transparent 75%)}
.trow.opp{background:linear-gradient(90deg,color-mix(in srgb,var(--opp) 40%,transparent),transparent 75%)}
.trow .who{min-width:0}
.trow .nm{font-family:var(--cond);font-weight:700;font-size:23px;line-height:1.05;display:flex;align-items:center;gap:8px;white-space:nowrap}
.trow .meta{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-top:4px}
.poss{width:17px;height:11px;border-radius:50%;background:#9a5a2c;box-shadow:inset 0 0 0 1.6px #fff;flex:0 0 auto}
.tos{display:flex;gap:3px}
.tos i{width:13px;height:4px;border-radius:2px;background:var(--chalk)}
.tos i.used{background:rgba(243,245,239,.18)}
.score{font-family:var(--cond);font-weight:800;font-size:46px;line-height:.9;font-variant-numeric:tabular-nums;min-width:1.2em;text-align:right}
.score.lead{color:var(--pk-gold)}
.lines{font-size:12px;color:var(--muted);margin:-4px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.lines table{width:100%;border-collapse:collapse}
.lines td,.lines th{padding:5px 6px;text-align:center;font-family:var(--cond);font-size:15px;font-weight:600}
.lines th{color:var(--faint);font-weight:500;font-size:13px}
.lines td:first-child,.lines th:first-child{text-align:left;width:40%}
.lines td:last-child{color:var(--chalk);font-weight:700}

/* role + field */
.role{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 8px}
.pill{display:inline-flex;align-items:center;gap:8px;font-family:var(--cond);font-weight:700;font-size:20px;line-height:1;padding:8px 14px 8px 10px;border-radius:999px}
.pill svg{width:20px;height:20px}
.pill.off{background:var(--pk-gold);color:#1b1404}
.pill.def{background:transparent;color:var(--chalk);box-shadow:inset 0 0 0 2px var(--chalk)}
.pill.neutral{background:rgba(255,255,255,.08);color:var(--chalk)}
.role .aside{text-align:right;font-size:12px;color:var(--muted);line-height:1.2}
.role .aside b{display:block;font-family:var(--cond);font-size:22px;color:var(--chalk);font-weight:700}

.field{position:relative;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.field svg{display:block;width:100%;height:auto}
.mv{transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.dd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:12px 2px 0}
.dd .big{font-family:var(--cond);font-weight:800;font-size:40px;line-height:1}
.dd .spot{font-size:14px;color:var(--muted)}
.dd .spot b{color:var(--chalk);font-weight:600}
.rz{display:inline-block;margin-left:8px;padding:3px 8px;border-radius:6px;background:var(--red);color:#fff;font-family:var(--cond);font-weight:700;font-size:15px;vertical-align:6px}
.key{display:flex;gap:14px;font-size:12px;color:var(--muted);padding-top:6px}
.key span{display:inline-flex;align-items:center;gap:5px}
.key i{width:14px;height:3px;border-radius:2px;display:inline-block}

/* sections */
.sec{margin-top:22px}
.sec h2{font-family:var(--cond);font-weight:700;font-size:21px;line-height:1;margin-bottom:10px;color:var(--chalk)}
.sec h2 small{font-family:var(--body);font-weight:500;font-size:13px;color:var(--muted);margin-left:6px}
.panel{background:var(--panel);border-radius:14px;padding:14px}
.lastplay .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.lastplay .ty{font-family:var(--cond);font-weight:700;font-size:18px;color:var(--pk-gold)}
.lastplay .yd{font-family:var(--cond);font-weight:700;font-size:18px}
.lastplay p{font-size:15px;line-height:1.45}
.plays{list-style:none}
.plays li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.plays li:first-child{border-top:0;padding-top:0}
.plays .dn{font-family:var(--cond);font-weight:600;font-size:15px;color:var(--muted);line-height:1.2}
.plays .sc{color:var(--pk-gold);font-weight:600}
.drv{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.drv:first-child{border-top:0;padding-top:0}
.drv .res{font-family:var(--cond);font-weight:700;font-size:16px}
.drv .res.pts{color:var(--pk-gold)}
.drv .ds{color:var(--muted);font-size:13px}
.chip{display:inline-grid;place-items:center;height:22px;padding:0 7px;border-radius:6px;font-family:var(--cond);font-weight:700;font-size:14px;background:var(--tc);color:var(--ti)}


.stat{display:grid;grid-template-columns:64px 1fr 64px;align-items:center;gap:10px;padding:7px 0}
.stat .v{font-family:var(--cond);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.stat .v.r{text-align:right}
.stat .mid2{display:flex;flex-direction:column;gap:5px}
.stat .lbl{font-size:12px;color:var(--muted);text-align:center}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:4px;height:6px}
.bars span{display:block;height:100%;border-radius:3px;background:rgba(255,255,255,.06);position:relative;overflow:hidden}
.bars span i{position:absolute;top:0;bottom:0;border-radius:3px}
.bars span:first-child i{right:0;background:var(--pk-gold)}
.bars span:last-child i{left:0;background:var(--opp-bar,var(--opp))}
.stathead{display:flex;justify-content:space-between;font-family:var(--cond);font-weight:700;font-size:15px;color:var(--muted);margin-bottom:4px}

.ldr{display:grid;grid-template-columns:1fr 70px 1fr;gap:8px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.ldr:first-of-type{border-top:0;padding-top:0}
.ldr .c{font-size:12px;color:var(--muted);text-align:center;padding-top:2px}
.ldr .p b{display:block;font-weight:600;font-size:14px}
.ldr .p span{font-size:12.5px;color:var(--muted)}
.ldr .p.r{text-align:right}

.scr{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.scr:first-child{border-top:0;padding-top:0}
.scr .q{font-family:var(--cond);color:var(--muted);font-size:14px;white-space:nowrap}
.scr .s{font-family:var(--cond);font-weight:700;font-size:16px;white-space:nowrap}

.info{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:16px}


/* standings */
.hero-rec{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:6px 2px 4px}
.hero-rec .r{font-family:var(--cond);font-weight:800;font-size:76px;line-height:.85;color:var(--pk-gold)}
.hero-rec .d{text-align:right;font-size:14px;color:var(--muted)}
.hero-rec .d b{display:block;font-family:var(--cond);font-size:24px;color:var(--chalk);font-weight:700}
table.std{width:100%;border-collapse:collapse;font-size:15px}
table.std th{font-weight:500;font-size:12px;color:var(--muted);text-align:right;padding:0 6px 8px}
table.std td{padding:11px 6px;text-align:right;border-top:1px solid var(--line);font-family:var(--cond);font-size:17px;font-variant-numeric:tabular-nums}
table.std th:first-child,table.std td:first-child{text-align:left}
table.std td:first-child{font-family:var(--body);font-size:15px;font-weight:500}
table.std tr.gb td{color:var(--pk-gold);font-weight:700}
.gm{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.gm:first-child{border-top:0;padding-top:0}
.gm .lb{font-size:12px;color:var(--muted);width:44px}
.gm .tx{flex:1;font-weight:600;line-height:1.25}
.gm .tx small{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:2px}
.gm .rt{font-family:var(--cond);font-weight:700;font-size:18px}
.gm .rt.w{color:var(--pk-gold)}

.foot{margin-top:26px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--faint)}
.foot button{background:none;border:1px solid var(--line);border-radius:999px;padding:7px 14px;color:var(--chalk);font-size:13px}
.err{padding:28px 14px;text-align:center;color:var(--muted)}
.err b{display:block;color:var(--chalk);font-size:16px;margin-bottom:4px}
.skel{height:300px;border-radius:18px;background:linear-gradient(90deg,var(--panel),var(--panel-2),var(--panel));background-size:200% 100%;animation:sh 1.4s infinite}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <span id="mastlogo"></span>
    <div>
      <h1>Green Bay Packers</h1>
      <div class="st" id="status">Loading game…</div>
    </div>
  </header>
  <main id="app"><div class="skel"></div></main>
  <footer class="foot">
    <span id="updated">Data from ESPN</span>
    <button id="refresh" type="button">Refresh</button>
  </footer>
</div>

<script>
/* ===== Logo slots =====
   Drop logo images into a "logos" folder next to this file, named by team
   abbreviation in lowercase (gb.png, min.png, chi.png, det.png …), or paste a
   URL / data: URI into LOGO_URLS below. Until a logo exists, a team-colored
   monogram fills the slot. */
const LOGO_DIR = "logos/";
const LOGO_EXT = ".png";
const LOGO_URLS = {
  // GB: "https://…/packers.png",
  // MIN: "data:image/png;base64,…",
};

(() => {
  const SITE = "https://site.api.espn.com/apis/site/v2/sports/football/nfl";
  const STAND = "https://site.api.espn.com/apis/v2/sports/football/nfl/standings?level=3";
  const GB = "GB";
  const GB_COLORS = { tc: "#203731", ti: "#FFB612", tr: "#FFB612" };
  const $ = s => document.querySelector(s);
  const app = $("#app");
  let timer = null, tick = null, fieldGame = null, NEXT = null, LAST = null;

  /* ---------- small helpers ---------- */
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const num = s => { if (s == null) return NaN; if (typeof s === "object") return Number(s.value ?? s.displayValue); return Number(s); };
  const comp = e => e.competitions[0];
  const st8 = e => (comp(e).status || e.status || {}).type?.state;
  const hasGB = e => comp(e).competitors.some(c => c.team.abbreviation === GB);
  const sides = e => { const cs = comp(e).competitors; const us = cs.find(c => c.team.abbreviation === GB); return { us, them: cs.find(c => c !== us) }; };
  const hex = h => "#" + String(h || "555555").replace("#", "");
  const lum = h => { const n = parseInt(String(h || "555555").replace("#", ""), 16); return (0.299 * (n >> 16) + 0.587 * (n >> 8 & 255) + 0.114 * (n & 255)) / 255; };
  const teamColors = t => {
    if (t.abbreviation === GB) return GB_COLORS;
    const tc = hex(t.color), alt = hex(t.alternateColor || "ffffff");
    return { tc, ti: lum(t.color) > .62 ? "#111" : "#fff", tr: alt, bar: lum(t.color) < .16 ? alt : tc };
  };
  const nick = t => t.name || t.shortDisplayName || t.abbreviation;
  const recOf = c => (c.records && c.records[0] && c.records[0].summary) || (c.record && (c.record[0]?.displayValue || c.record[0]?.summary)) || "";
  const fmt = (d, o) => new Date(d).toLocaleString([], o);
  const ord = n => n + (["th","st","nd","rd"][(n % 100 > 10 && n % 100 < 14) ? 0 : (n % 10 < 4 ? n % 10 : 0)] || "th");
  const isAdmin = p => /timeout|end (of )?(period|quarter|half|game)|end quarter|two.minute/i.test((p.type?.text || "") + " " + (p.text || "").slice(0, 40));
  const allPlays = sum => { const d = sum?.drives; if (!d) return []; return [...(d.previous || []), ...(d.current ? [d.current] : [])].flatMap(x => x.plays || []); };
  const periodName = p => p <= 4 ? ord(p) + " quarter" : (p === 5 ? "Overtime" : "OT" + (p - 4));

  function logo(team, sz = 48) {
    const ab = team.abbreviation, c = teamColors(team);
    const src = LOGO_URLS[ab] || (LOGO_DIR + ab.toLowerCase() + LOGO_EXT);
    return `<span class="logo" style="--sz:${sz}px;--tc:${c.tc};--ti:${c.ti};--tr:${c.tr}" aria-label="${esc(team.displayName || ab)} logo">
      <b>${esc(ab)}</b><img src="${esc(src)}" alt="" onload="this.parentNode.classList.add('has-img')" onerror="this.remove()"></span>`;
  }
  const chip = t => { const c = teamColors(t); return `<span class="chip" style="--tc:${c.tc};--ti:${c.ti}">${esc(t.abbreviation)}</span>`; };

  async function getJSON(url) { const r = await fetch(url, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); }

  /* ---------- field geometry: Packers end zone always on the left ---------- */
  // x = yards from the Packers' goal line (0..100)
  const FX = yd => 100 + yd * 10; // SVG units
  function spotFromText(t) {
    if (!t) return null; t = t.trim();
    if (/^50$/.test(t)) return 50;
    const m = t.match(/^([A-Z]{2,3})\s+(\d{1,2})$/); if (!m) return null;
    return m[1] === GB ? +m[2] : 100 - +m[2];
  }
  const spotFromYTE = (teamId, yte, gbId) => (yte == null ? null : (teamId === gbId ? 100 - yte : yte));

  function fieldSVG(gbTeam, oppTeam) {
    const o = teamColors(oppTeam);
    let s = `<svg viewBox="0 0 1200 470" role="img" aria-label="Field diagram">
      <defs>
        <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".18"/><stop offset=".25" stop-color="#000" stop-opacity="0"/><stop offset=".75" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".22"/></linearGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
      </defs>
      <rect width="1200" height="470" fill="#2b6532"/>`;
    for (let i = 0; i < 20; i++) s += `<rect x="${100 + i * 50}" y="0" width="50" height="470" fill="${i % 2 ? "#2b6532" : "#2f6d36"}"/>`;
    // end zones
    s += `<rect x="0" y="0" width="100" height="470" fill="#203731"/>
      <rect x="1100" y="0" width="100" height="470" fill="${o.tc}"/>
      <text x="50" y="235" transform="rotate(-90 50 235)" text-anchor="middle" dominant-baseline="central" font-family="Barlow Condensed" font-weight="800" font-size="62" letter-spacing="10" fill="#FFB612">PACKERS</text>
      <text x="1150" y="235" transform="rotate(90 1150 235)" text-anchor="middle" dominant-baseline="central" font-family="Barlow Condensed" font-weight="800" font-size="62" letter-spacing="10" fill="${o.ti}">${esc(nick(oppTeam).toUpperCase())}</text>`;
    // lines every 5 yards, hashes every yard
    for (let y = 0; y <= 100; y += 5) s += `<line x1="${FX(y)}" y1="6" x2="${FX(y)}" y2="464" stroke="#fff" stroke-opacity="${y % 50 === 0 ? .95 : y % 10 === 0 ? .7 : .45}" stroke-width="${y === 0 || y === 100 ? 5 : 2.5}"/>`;
    for (let y = 1; y < 100; y++) if (y % 5) s += `<line x1="${FX(y)}" x2="${FX(y)}" y1="168" y2="180" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><line x1="${FX(y)}" x2="${FX(y)}" y1="290" y2="302" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><line x1="${FX(y)}" x2="${FX(y)}" y1="6" y2="16" stroke="#fff" stroke-opacity=".4" stroke-width="2"/><line x1="${FX(y)}" x2="${FX(y)}" y1="454" y2="464" stroke="#fff" stroke-opacity=".4" stroke-width="2"/>`;
    s += `<rect x="2" y="2" width="1196" height="466" fill="none" stroke="#fff" stroke-opacity=".9" stroke-width="5"/>`;
    // yard numbers
    for (let y = 10; y <= 90; y += 10) {
      const n = Math.min(y, 100 - y);
      s += `<text x="${FX(y)}" y="420" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="54" fill="#fff" fill-opacity=".8">${n}</text>
            <text x="${FX(y)}" y="50" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="54" fill="#fff" fill-opacity=".8" transform="rotate(180 ${FX(y)} 32)">${n}</text>`;
    }
    // midfield logo slot (hidden when no file)
    const src = LOGO_URLS[GB] || (LOGO_DIR + "gb" + LOGO_EXT);
    s += `<image href="${esc(src)}" x="540" y="175" width="120" height="120" opacity=".9" onerror="this.remove()"/>`;
    s += `<rect width="1200" height="470" fill="url(#vig)" pointer-events="none"/>`;
    // live overlays
    s += `<g id="ov" opacity="0">
        <rect id="drv" x="0" y="20" width="0" height="430" fill="#fff" fill-opacity=".10"/>
        <line id="drvStart" x1="0" x2="0" y1="20" y2="450" stroke="#fff" stroke-opacity=".55" stroke-width="3" stroke-dasharray="10 8"/>
        <g id="fdG" class="mv"><rect x="-4" y="6" width="8" height="458" fill="${"#f5e14a"}"/></g>
        <g id="losG" class="mv"><rect x="-4" y="6" width="8" height="458" fill="#4aa8ff"/></g>
        <g id="ballG" class="mv">
          <ellipse cx="0" cy="235" rx="38" ry="24" fill="#fff" opacity=".35" filter="url(#glow)"/>
          <ellipse cx="0" cy="235" rx="26" ry="16" fill="#8a4b22" stroke="#3e200c" stroke-width="2"/>
          <path d="M-10 235 H10 M-6 230 V240 M-2 230 V240 M2 230 V240 M6 230 V240" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
          <path id="arrow" d="M40 235 l-14 -14 v28 z" fill="#fff"/>

  }

  function updateField({ ball, fd, driveStart, dir, offColor }) {
    const ov = document.getElementById("ov"); if (!ov) return;
    if (ball == null) { ov.setAttribute("opacity", "0"); return; }
    ov.setAttribute("opacity", "1");
    const bx = FX(ball);
    $("#losG").style.transform = `translateX(${bx}px)`;
    $("#ballG").style.transform = `translateX(${bx}px)`;
    $("#arrow").setAttribute("transform", dir < 0 ? "scale(-1 1)" : "");
    $("#arrow").style.transformBox = "view-box";
    if (fd != null) { $("#fdG").style.display = ""; $("#fdG").style.transform = `translateX(${FX(fd)}px)`; }
    else $("#fdG").style.display = "none";
    const drv = $("#drv"), ds = $("#drvStart");
    if (driveStart != null && Math.abs(driveStart - ball) > 0.4) {
      const a = Math.min(FX(driveStart), bx), b = Math.max(FX(driveStart), bx);
      drv.setAttribute("x", a); drv.setAttribute("width", b - a); drv.setAttribute("fill", offColor || "#fff"); drv.setAttribute("fill-opacity", ".22");
      ds.setAttribute("x1", FX(driveStart)); ds.setAttribute("x2", FX(driveStart)); ds.style.display = "";
    } else { drv.setAttribute("width", 0); ds.style.display = "none"; }

  /* ---------- shared blocks ---------- */
  function scorebug(e, sum, { mid, possId } = {}) {
    const { us, them } = sides(e); const c = comp(e);
    const a = num(us.score), b = num(them.score);
    const post = st8(e) === "post", pre = st8(e) === "pre";

    const tos = n => n == null ? "" : `<div class="tos" aria-label="${n} timeouts left">${[0,1,2].map(i => `<i class="${i < n ? "" : "used"}"></i>`).join("")}</div>`;
    const sideHTML = (cpt, cls, sc, other) => `
      <div class="trow ${cls}">
        ${logo(cpt.team, 44)}
        <div class="who"><div class="nm">${esc(cpt.team.abbreviation === GB ? "Packers" : nick(cpt.team))}${possId && cpt.team.id === possId ? `<span class="poss" title="Has the ball"></span>` : ""}</div>
          <div class="meta"><span>${esc(recOf(cpt))}</span>${pre ? "" : tos(toFor(cpt))}</div></div>
        ${pre ? "" : `<div class="score ${(post || st8(e) === "in") && sc > other ? "lead" : ""}">${isNaN(sc) ? "0" : sc}</div>`}

    return `<section class="bug" style="--opp:${oc.tc}">

  function lineScore(sum, e) {
    const { us, them } = sides(e); const a = num(us.score), b = num(them.score);
    let lines = "";
    if (sum) {
      const hc = sum.header?.competitions?.[0]?.competitors || [];
      const hu = hc.find(x => x.team.abbreviation === GB), ht = hc.find(x => x !== hu);
      if (hu?.linescores?.length) {
        const n = Math.max(4, hu.linescores.length);
        const cell = (arr, i) => arr?.[i]?.displayValue ?? "";
        lines = `<div class="lines"><table><thead><tr><th></th>${Array.from({ length: n }, (_, i) => `<th>${i < 4 ? i + 1 : "OT"}</th>`).join("")}<th>T</th></tr></thead><tbody>
          <tr><td>Packers</td>${Array.from({ length: n }, (_, i) => `<td>${esc(cell(hu.linescores, i))}</td>`).join("")}<td>${isNaN(a) ? "" : a}</td></tr>
          <tr><td>${esc(nick(them.team))}</td>${Array.from({ length: n }, (_, i) => `<td>${esc(cell(ht?.linescores, i))}</td>`).join("")}<td>${isNaN(b) ? "" : b}</td></tr></tbody></table></div>`;
      }

  function infoLine(e, sum) {
    const c = comp(e), bits = [];
    if (c.venue?.fullName) bits.push(esc(c.venue.fullName));
    const b = (c.broadcasts || []).flatMap(x => x.names || []); if (b.length) bits.push(esc([...new Set(b)].join(" / ")));
    const w = sum?.gameInfo?.weather; if (w?.temperature != null) bits.push(`${w.temperature}°${w.conditionId ? ", " + esc(w.conditionId) : ""}`);
    return bits.length ? `<div class="info">${bits.map(x => `<span>${x}</span>`).join("")}</div>` : "";
  }

  function statsBlock(sum, them) {
    const teams = sum?.boxscore?.teams; if (!teams || teams.length < 2) return "";
    const tu = teams.find(t => t.team.abbreviation === GB), tt = teams.find(t => t !== tu); if (!tu || !tt) return "";
    const g = (t, n) => (t.statistics || []).find(s => s.name === n)?.displayValue;
    const rows = [
      ["totalYards", "Total yards"], ["netPassingYards", "Passing yards"], ["rushingYards", "Rushing yards"],
      ["firstDowns", "First downs"], ["thirdDownEff", "Third down"], ["turnovers", "Turnovers"],
      ["totalPenaltiesYards", "Penalties"], ["possessionTime", "Possession"]];
    const val = (n, v) => {
      if (v == null) return 0; v = String(v).trim();
      if (n === "possessionTime") { const [m, s] = v.split(":").map(Number); return m * 60 + (s || 0); }
      if (n === "thirdDownEff") { const [x, y] = v.split("-").map(Number); return y ? x / y : 0; }
      if (n === "totalPenaltiesYards") return Number(v.split("-")[1]) || 0;
      return Number(v) || 0;
    };
    const oc = teamColors(them.team);
    const body = rows.map(([n, l]) => {
      const a = g(tu, n), b = g(tt, n); if (a == null && b == null) return "";
      const va = val(n, a), vb = val(n, b), mx = Math.max(va, vb) || 1;
      return `<div class="stat"><div class="v">${esc(a ?? "–")}</div><div class="mid2"><div class="lbl">${l}</div>
        <div class="bars"><span><i style="width:${va / mx * 100}%"></i></span><span><i style="width:${vb / mx * 100}%"></i></span></div></div><div class="v r">${esc(b ?? "–")}</div></div>`;
    }).join("");
    if (!body.trim()) return "";
    return `<section class="sec"><h2>Team stats</h2><div class="panel" style="--opp-bar:${oc.bar}"><div class="stathead"><span>Packers</span><span>${esc(nick(them.team))}</span></div>${body}</div></section>`;
  }

  function leadersBlock(sum, them) {
    const L = sum?.leaders; if (!L?.length) return "";
    const lu = L.find(x => x.team?.abbreviation === GB), lt = L.find(x => x !== lu); if (!lu || !lt) return "";
    const pick = (t, n) => { const c = t.leaders?.find(x => x.name === n)?.leaders?.[0]; return c ? { n: c.athlete?.shortName || c.athlete?.displayName, v: c.displayValue } : null; };
    const rows = [["passingYards", "Passing"], ["rushingYards", "Rushing"], ["receivingYards", "Receiving"], ["sacks", "Sacks"], ["totalTackles", "Tackles"]];
    const body = rows.map(([k, l]) => {
      const a = pick(lu, k), b = pick(lt, k); if (!a && !b) return "";
      const p = (x, r) => `<div class="p${r ? " r" : ""}">${x ? `<b>${esc(x.n)}</b><span>${esc(x.v)}</span>` : `<span>–</span>`}</div>`;
      return `<div class="ldr">${p(a)}<div class="c">${l}</div>${p(b, 1)}</div>`;
    }).join("");
    return `<section class="sec"><h2>Leaders</h2><div class="panel"><div class="stathead"><span>Packers</span><span>${esc(nick(them.team))}</span></div>${body}</div></section>`;
  }

  function scoringBlock(sum, e) {
    const sp = sum?.scoringPlays || []; const ls = lineScore(sum, e); if (!sp.length && !ls) return "";
    const { us } = sides(e); const gbHome = us.homeAway === "home";
    const rows = [...sp].reverse().map(p => {
      const gs = gbHome ? p.homeScore : p.awayScore, os = gbHome ? p.awayScore : p.homeScore;
      return `<div class="scr">${p.team ? chip(p.team.abbreviation === GB ? { abbreviation: GB } : { ...p.team, color: p.team.color || comp(e).competitors.find(c => c.team.id === p.team.id)?.team.color }) : ""}
        <div><div>${esc(p.text)}</div><div class="q">${esc(ord(p.period?.number || 1))} · ${esc(p.clock?.displayValue || "")}</div></div>
        <div class="s">${gs}–${os}</div></div>`;
    }).join("");
    return `<section class="sec"><h2>Scoring</h2><div class="panel">${ls}${rows}</div></section>`;
  }

  /* ---------- views ---------- */
  function viewLive(e, sum) {
    const c = comp(e), sit = c.situation || {}, st = c.status;
    const { us, them } = sides(e); const gbId = us.team.id;
    const hdr = sum?.header?.competitions?.[0]?.competitors || [];
    const cur = sum?.drives?.current;
    const possId = sit.possession || hdr.find(x => x.possession)?.team?.id || sit.lastPlay?.end?.team?.id || cur?.team?.id || null;
    const gbBall = possId === gbId;
    const offTeam = possId ? (gbBall ? us.team : them.team) : null;

    // ball spot
    let ball = spotFromText(sit.possessionText);
    if (ball == null && sit.lastPlay?.end) ball = spotFromYTE(sit.lastPlay.end.team?.id, sit.lastPlay.end.yardsToEndzone, gbId);
    const dir = gbBall ? 1 : -1;
    let fd = null;
    if (ball != null && sit.distance != null && sit.down > 0) {
      fd = /goal/i.test(sit.downDistanceText || sit.shortDownDistanceText || "") ? (gbBall ? 100 : 0) : Math.max(0, Math.min(100, ball + dir * sit.distance));
    }
    let driveStart = null;
    if (cur && cur.team?.id === possId && cur.plays?.length) {
      const first = cur.plays.find(p => !/kickoff/i.test(p.type?.text || "") && p.start?.yardsToEndzone != null);
      if (first) driveStart = spotFromYTE(first.start.team?.id, first.start.yardsToEndzone, gbId);
    }

    // clock / status
    const typeName = st.type.name || "";
    let clockTxt = st.displayClock || "", perTxt = periodName(st.period || 1);
    if (/HALFTIME/.test(typeName)) { clockTxt = "Half"; perTxt = "Halftime"; }
    else if (/END_PERIOD/.test(typeName)) { clockTxt = "0:00"; perTxt = "End of " + ord(st.period); }
    $("#status").innerHTML = `<span class="dot"></span>Live vs ${esc(them.team.displayName)}`;

    const role = !possId ? `<span class="pill neutral">${esc(st.type.detail || "In progress")}</span>`
      : gbBall ? `<span class="pill off">${icoBall}Packers on offense</span>`
      : `<span class="pill def">${icoShield}Packers on defense</span>`;

    const ddBig = sit.down > 0 ? (sit.shortDownDistanceText || `${ord(sit.down)} & ${sit.distance}`) : (sit.lastPlay?.type?.text || "");
    const spot = sit.possessionText ? `Ball on <b>${esc(sit.possessionText)}</b>` : "";
    const driveTxt = cur && cur.team?.id === possId && cur.description && !/^0 plays/.test(cur.description) ? `${esc(cur.team.abbreviation)} drive: ${esc(cur.description)}` : "";

    // last play: skip timeouts / end-of-quarter markers
    let lp = sit.lastPlay;
    if (!lp?.text || isAdmin(lp)) { const ps = allPlays(sum).filter(p => p.text && !isAdmin(p)); lp = ps[ps.length - 1] || lp; }
    const lpHTML = lp?.text ? `<section class="sec"><h2>Last play</h2><div class="panel lastplay">
      <div class="t"><span class="ty">${esc(lp.type?.text || "Play")}</span>${lp.statYardage != null && !/kick|punt|timeout|incomplet/i.test(lp.type?.text || "") ? `<span class="yd">${lp.statYardage > 0 ? "+" : ""}${lp.statYardage} yds</span>` : ""}</div>
      <p>${esc(lp.text.trim())}</p></div></section>` : "";

    // current (or just-finished) drive plays
    let drvHTML = "";
    const curPlays = (cur?.plays || []).filter(p => p.text && !isAdmin(p));
    if (curPlays.length > 1) {
      const curIsPoss = cur.team?.id === possId;
      const ttl = curIsPoss ? "This drive" : `${cur.team?.abbreviation === GB ? "Packers" : esc(cur.team?.shortDisplayName || cur.team?.abbreviation || "")} last drive`;
      const items = [...curPlays].reverse().slice(0, 12).map(p => {
        const dn = p.start?.down > 0 ? (p.start.shortDownDistanceText || `${ord(p.start.down)} & ${p.start.distance}`) : (p.type?.abbreviation || "");
        return `<li><span class="dn">${esc(dn)}</span><span class="${p.scoringPlay ? "sc" : ""}">${esc((p.text || "").trim())}</span></li>`;
      }).join("");
      drvHTML = `<section class="sec"><h2>${ttl}<small>${esc(cur.description || "")}</small></h2><div class="panel"><ul class="plays">${items}</ul></div></section>`;
    }

    // previous drives
    let prevHTML = "";
    const prev = (sum?.drives?.previous || []).filter(d => d.displayResult || d.result).filter(d => d.id !== cur?.id).reverse().slice(0, 8);
    if (prev.length) {
      prevHTML = `<section class="sec"><h2>Drives</h2><div class="panel">${prev.map(d => {
        const t = d.team?.abbreviation === GB ? { abbreviation: GB } : { ...d.team, color: them.team.color };
        return `<div class="drv">${chip(t)}<div><div class="res ${d.isScore ? "pts" : ""}">${esc(d.displayResult || d.result || "")}</div><div class="ds">${esc(d.description || "")}</div></div><div class="ds">${esc(ord(d.start?.period?.number || 1))} ${esc(d.start?.clock?.displayValue || "")}</div></div>`;
      }).join("")}</div></section>`;
    }

    app.innerHTML = `
      ${scorebug(e, sum, { possId, mid: `<span class="per">${esc(perTxt)}</span><span class="clk">${esc(clockTxt)}</span>` })}
      <div class="role">${role}</div>
      <div class="field" id="field"></div>
      <div class="dd" aria-live="polite"><div><span class="big">${esc(ddBig)}</span>${sit.isRedZone ? `<span class="rz">Red zone</span>` : ""}</div><div class="spot">${spot}</div></div>
      <div class="key"><span><i style="background:var(--los)"></i>Line of scrimmage</span>${fd != null ? `<span><i style="background:var(--fd)"></i>First down</span>` : ""}${driveStart != null ? `<span><i style="background:rgba(255,255,255,.5)"></i>Drive start</span>` : ""}</div>
      ${driveTxt ? `<div class="info" style="margin-top:8px"><span>${driveTxt}</span></div>` : ""}
      ${lpHTML}${drvHTML}${statsBlock(sum, them)}${leadersBlock(sum, them)}${scoringBlock(sum, e)}${prevHTML}
      ${infoLine(e, sum)}`;

    // persist the field SVG between refreshes so the ball can glide
    const holder = $("#field");
    if (!window.__fieldNode || fieldGame !== e.id) { fieldGame = e.id; const d = document.createElement("div"); d.innerHTML = fieldSVG(us.team, them.team); window.__fieldNode = d.firstElementChild; }
    holder.appendChild(window.__fieldNode);
    requestAnimationFrame(() => updateField({ ball, fd, driveStart, dir, offColor: offTeam ? teamColors(offTeam).bar : "#fff" }));
  }

  function viewPregame(e, sum) {
    const { us, them } = sides(e); const start = new Date(e.date);
    $("#status").textContent = `${us.homeAway === "home" ? "Home vs" : "At"} ${them.team.displayName}`;
    app.innerHTML = `
      ${scorebug(e, null, { mid: `<span class="per">Kickoff in</span><span class="clk" id="cd">--:--:--</span>` })}
      <div class="role"><span class="pill off">${icoBall}Game day</span><div class="aside">Kickoff<b>${esc(fmt(start, { hour: "numeric", minute: "2-digit" }))}</b></div></div>
      <div class="field" id="field"></div>
      ${infoLine(e, sum)}${statsBlock(sum, them)}`;
    fieldGame = null; window.__fieldNode = null;
    const d = document.createElement("div"); d.innerHTML = fieldSVG(us.team, them.team); $("#field").appendChild(d.firstElementChild);
    clearInterval(tick);
    const pad = n => String(n).padStart(2, "0");
    const upd = () => {
      let s = Math.max(0, Math.floor((start - Date.now()) / 1000));
      const days = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
      const el = $("#cd"); if (el) el.textContent = days ? `${days}d ${pad(h)}:${pad(m)}` : `${pad(h)}:${pad(m)}:${pad(ss)}`;
      if (s === 0) { clearInterval(tick); load(); }
    };
    upd(); tick = setInterval(upd, 1000);
  }

  function viewFinal(e, sum) {
    const { us, them } = sides(e);
    const a = num(us.score), b = num(them.score);
    $("#status").textContent = `${a > b ? "Packers win" : "Final"}, ${fmt(e.date, { weekday: "long", month: "short", day: "numeric" })}`;
    const ot = /OT/.test(comp(e).status?.type?.detail || "");
    app.innerHTML = `
      ${scorebug(e, sum, { mid: `<span class="fin">Final${ot ? " in overtime" : ""}</span><span class="per">${esc(fmt(e.date, { month: "short", day: "numeric" }))}</span>` })}
      ${nextGame()}
      ${statsBlock(sum, them)}${leadersBlock(sum, them)}${scoringBlock(sum, e)}${infoLine(e, sum)}`;

  function nextGame() {
    if (!NEXT) return "";

  }
  function nextRow() {
    if (!NEXT) return "";
    const { us, them } = sides(NEXT);
    return `<div class="gm"><span class="lb">Next</span>${logo(them.team, 30)}
      <span class="tx">${us.homeAway === "home" ? "vs" : "at"} ${esc(them.team.displayName)}<small>${esc(fmt(NEXT.date, { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }))}${comp(NEXT).venue?.fullName ? ", " + esc(comp(NEXT).venue.fullName) : ""}</small></span></div>`;
  }

  function viewStandings(div) {
    $("#status").textContent = div ? div.name + " standings" : "Standings";
    if (!div) { app.innerHTML = `<div class="panel err"><b>Standings aren't available right now.</b>The page will try again in a few minutes.</div>${nextGame()}`; return; }
    const stat = (en, n) => en.stats.find(s => s.name === n) || {};
    const rows = [...div.standings.entries].sort((x, y) => (stat(y, "winPercent").value ?? 0) - (stat(x, "winPercent").value ?? 0) || (stat(x, "playoffSeed").value ?? 99) - (stat(y, "playoffSeed").value ?? 99));
    const gb = rows.find(r => r.team.abbreviation === GB); const place = rows.indexOf(gb) + 1;
    const seed = gb && stat(gb, "playoffSeed").value;
    let last = "";
    if (LAST) {
      const { us, them } = sides(LAST); const a = num(us.score), b = num(them.score); const r = a > b ? "W" : a < b ? "L" : "T";
      last = `<div class="gm"><span class="lb">Last</span>${logo(them.team, 30)}<span class="tx">${us.homeAway === "home" ? "vs" : "at"} ${esc(them.team.displayName)}</span><span class="rt ${r === "W" ? "w" : ""}">${r} ${a}–${b}</span></div>`;
    }
    app.innerHTML = `
      <section class="bug" style="padding:16px 16px 14px">
        <div class="hero-rec"><div class="r num">${esc(stat(gb || {stats:[]}, "overall").displayValue || "")}</div>
          <div class="d"><b>${ord(place)} in the ${esc(div.name.replace(/^NFC |^AFC /, ""))}</b>${seed && seed <= 7 ? `No. ${seed} seed in the NFC` : "Outside the playoff seeds"}<br>Streak ${esc(stat(gb || {stats:[]}, "streak").displayValue || "–")}</div></div>
      </section>
      <section class="sec"><h2>${esc(div.name)}</h2><div class="panel"><table class="std"><thead><tr><th>Team</th><th>W-L</th><th>Div</th><th>PF</th><th>PA</th><th>Strk</th></tr></thead><tbody>
        ${rows.map(r => `<tr class="${r.team.abbreviation === GB ? "gb" : ""}"><td>${esc(r.team.abbreviation === GB ? "Packers" : (r.team.name || r.team.shortDisplayName))}</td><td>${esc(stat(r, "overall").displayValue || "")}</td><td>${esc(stat(r, "divisionRecord").displayValue || "")}</td><td>${esc(stat(r, "pointsFor").displayValue || "")}</td><td>${esc(stat(r, "pointsAgainst").displayValue || "")}</td><td>${esc(stat(r, "streak").displayValue || "")}</td></tr>`).join("")}
      </tbody></table></div></section>
      <section class="sec"><div class="panel">${last}${nextRow()}</div></section>`;
  }

  const icoBall = `<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="10" ry="6.5" transform="rotate(-35 12 12)" fill="currentColor"/><path d="M9 15l6-6M10.5 10.5l1 1M12 9l1 1M9 12l1 1" stroke="var(--pk-gold)" stroke-width="1.6" stroke-linecap="round"/></svg>`;
  const icoShield = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l8 3v6c0 5-3.4 8.6-8 10-4.6-1.4-8-5-8-10v-6z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>`;

  /* ---------- main loop ---------- */
  async function load() {
    clearTimeout(timer);
    const force = (location.hash || "").slice(1);
    try {
      const [sb, sched] = await Promise.allSettled([getJSON(SITE + "/scoreboard"), getJSON(SITE + "/teams/gb/schedule")]);
      const sbEv = sb.status === "fulfilled" ? (sb.value.events || []).find(hasGB) : null;
      const events = sched.status === "fulfilled" ? (sched.value.events || []) : [];
      if (sbEv) { const i = events.findIndex(x => x.id === sbEv.id); if (i >= 0) events[i] = sbEv; else events.push(sbEv); }
      events.sort((x, y) => new Date(x.date) - new Date(y.date));
      if (!events.length) throw new Error("no data");
      const now = Date.now();
      const live = events.find(x => st8(x) === "in");
      NEXT = events.find(x => st8(x) === "pre" && new Date(x.date) > now - 3 * 3600e3) || null;
      const done = events.filter(x => st8(x) === "post"); LAST = done[done.length - 1] || null;
      const isWin = x => { const { us, them } = sides(x); return num(us.score) > num(them.score); };
      const lastWin = [...done].reverse().find(isWin);

      let mode;
      if (force === "upcoming" && NEXT) mode = "pre";
      else if (force === "win" && lastWin) mode = "final";
      else if (force === "standings") mode = "standings";
      else if (live) mode = "live";
      else if (NEXT && new Date(NEXT.date) - now <= 24 * 3600e3) mode = "pre";
      else if (LAST && isWin(LAST)) mode = "final";
      else mode = "standings";
      if (mode !== "pre") clearInterval(tick);

      const ev = mode === "live" ? live : mode === "pre" ? NEXT : mode === "final" ? (force === "win" ? lastWin : LAST) : null;
      let sum = null;
      if (ev) { try { sum = await getJSON(SITE + "/summary?event=" + ev.id); } catch (_) {} }

      if (mode === "live") viewLive(ev, sum);
      else if (mode === "pre") viewPregame(ev, sum);
      else if (mode === "final") viewFinal(ev, sum);
      else {
        let div = null;
        try { const s = await getJSON(STAND); const walk = n => { if (!n.isConference && n.standings?.entries?.some(x => x.team.abbreviation === GB)) return n; for (const k of n.children || []) { const f = walk(k); if (f) return f; } return null; }; div = walk(s); } catch (_) {}
        viewStandings(div);
      }

      const soon = NEXT && new Date(NEXT.date) - now < 15 * 60e3;
      const every = mode === "live" ? 10e3 : soon ? 30e3 : 5 * 60e3;
      $("#updated").textContent = `Updated ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" })}`;
      timer = setTimeout(load, every);
    } catch (err) {
      app.innerHTML = `<div class="panel err"><b>Can't reach the live game feed.</b>Check your connection. Trying again in 30 seconds.</div>`;
      $("#updated").textContent = "Offline";
      timer = setTimeout(load, 30e3);
    }
  }

  $("#mastlogo").innerHTML = logo({ abbreviation: GB, displayName: "Green Bay Packers" }, 44);
  $("#refresh").addEventListener("click", load);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
  window.addEventListener("hashchange", load);
  load();
})();
</script>
</body>
</html>
