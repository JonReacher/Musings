<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backyard planner</title>
<style>
/*FONTS*/
:root {
  --lichen: #eef1ea;
  --paper: #f8f9f5;
  --bark: #23271f;
  --moss: #5e6857;
  --stone: #d5d9cd;
  --stone-2: #c3c9ba;
  --marigold: #f2a541;
  --marigold-ink: #8a4f06;
  --pool: #2f7fa8;
  --danger: #b2412b;
  --hand: 'Architects Daughter', 'Bricolage Grotesque', cursive;
  --ui: 'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r-panel: 10px;
  --r-ctl: 7px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #9fb3c2; color: var(--bark); font-family: var(--ui); font-size: 13px; line-height: 1.35; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--pool); outline-offset: 2px; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; touch-action: none; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.lbl { position: absolute; left: 0; top: 0; will-change: transform; font-family: var(--hand); font-size: 15px; line-height: 1; padding: 4px 7px 3px; background: rgba(255, 253, 245, 0.94); border: 1.5px solid var(--bark); border-radius: 4px; white-space: nowrap; color: var(--bark); box-shadow: 0 1px 0 rgba(0,0,0,.15); }
.lbl-soft { background: rgba(35, 39, 31, 0.78); color: #fff; border-color: transparent; font-size: 13px; transform-origin: 0 0; margin-top: 26px; }
.lbl-measure { background: var(--marigold); border-color: var(--bark); font-size: 17px; }
.lbl-lock { font-family: var(--ui); font-size: 12px; background: rgba(35,39,31,.82); color: #fff; border: 0; }

/* ---------- top bar ---------- */
#topbar { position: fixed; top: 10px; left: 10px; right: 10px; height: 48px; display: flex; align-items: center; gap: 6px; padding: 0 8px; background: var(--lichen); border: 1px solid var(--stone); border-radius: var(--r-panel); z-index: 20; }
.brand { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; padding: 0 8px 0 4px; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.brand svg { flex: none; }
.sep { width: 1px; align-self: stretch; margin: 10px 4px; background: var(--stone); }
.btn { height: 32px; padding: 0 11px; border: 1px solid transparent; background: transparent; border-radius: var(--r-ctl); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { background: rgba(35,39,31,.07); }
.btn[disabled] { opacity: .35; pointer-events: none; }
.btn.outline { border-color: var(--stone-2); background: var(--paper); }
.btn.solid { background: var(--bark); color: var(--paper); }
.btn.solid:hover { background: #3a4033; }
.btn.accent { background: var(--marigold); color: #2b1a00; font-weight: 600; }
.btn.danger { color: var(--danger); }
.btn.on { background: var(--bark); color: var(--paper); }
.icon { width: 18px; height: 18px; flex: none; }
.seg { display: inline-flex; background: rgba(35,39,31,.07); border-radius: var(--r-ctl); padding: 2px; }
.seg button { height: 28px; padding: 0 12px; border: 0; background: transparent; border-radius: 5px; font-weight: 500; }
.seg button.on { background: var(--paper); box-shadow: 0 0 0 1px var(--stone-2); }
#layoutBtn { max-width: 280px; min-width: 120px; flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
#topbar > .btn:not(#layoutBtn), #topbar > .seg, #topbar > .time, #topbar > .brand { flex: none; }
#layoutBtn span { overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.time { display: flex; align-items: center; gap: 8px; padding: 0 6px; }
.time input[type=range] { width: 150px; }
.time .tval { font-variant-numeric: tabular-nums; min-width: 62px; font-weight: 600; }

/* ---------- panels ---------- */
.panel { position: fixed; top: 68px; bottom: 10px; width: 292px; background: var(--lichen); border: 1px solid var(--stone); border-radius: var(--r-panel); z-index: 15; display: flex; flex-direction: column; overflow: hidden; }
#catalog { left: 10px; }
#inspector { right: 10px; }
.panel-h { padding: 12px 14px 10px; border-bottom: 1px solid var(--stone); }
.panel-h h2 { margin: 0; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.panel-h p { margin: 3px 0 0; color: var(--moss); font-size: 12px; }
.scroll { overflow-y: auto; flex: 1; scrollbar-width: thin; }
.search { margin: 10px 12px 4px; position: relative; }
.search input { width: 100%; height: 34px; border: 1px solid var(--stone-2); background: var(--paper); border-radius: var(--r-ctl); padding: 0 10px 0 32px; }
.search svg { position: absolute; left: 9px; top: 8px; color: var(--moss); }
.cat { border-bottom: 1px solid var(--stone); }
.cat > button { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 11px 14px; background: none; border: 0; font-weight: 600; font-size: 13.5px; text-align: left; }
.cat > button .n { color: var(--moss); font-weight: 400; font-size: 12px; }
.cat > button:hover { background: rgba(35,39,31,.04); }
.cat.open > button { color: var(--bark); }
.tiles { display: none; grid-template-columns: 1fr 1fr; gap: 8px; padding: 2px 12px 14px; }
.cat.open .tiles, .tiles.show { display: grid; }
.tile { position: relative; border: 1px solid transparent; border-radius: 8px; padding: 4px 4px 7px; background: transparent; text-align: left; display: flex; flex-direction: column; gap: 3px; }
.tile:hover { background: var(--paper); border-color: var(--stone-2); }
.tile .thumb { width: 100%; aspect-ratio: 4/3; border-radius: 6px; background: linear-gradient(#e2e7dc, #d3dac9); object-fit: cover; display: block; }
.tile .nm { font-size: 12.5px; font-weight: 500; line-height: 1.2; padding: 0 2px; }
.tile .draw { position: absolute; top: 8px; left: 8px; font-size: 10.5px; font-weight: 600; background: var(--bark); color: #fff; padding: 2px 6px; border-radius: 4px; }

/* inspector */
.ins-h { display: flex; align-items: flex-start; gap: 8px; padding: 12px 12px 10px 14px; border-bottom: 1px solid var(--stone); }
.ins-h .names { flex: 1; min-width: 0; }
.ins-h input.name { width: 100%; border: 1px solid transparent; background: transparent; font-weight: 700; font-size: 16px; padding: 2px 4px; margin-left: -5px; border-radius: 5px; letter-spacing: -0.01em; }
.ins-h input.name:hover, .ins-h input.name:focus { border-color: var(--stone-2); background: var(--paper); }
.ins-h .type { color: var(--moss); font-size: 12px; }
.sizebig { font-family: var(--hand); font-size: 26px; line-height: 1.1; padding: 12px 14px 2px; }
.sizebig small { font-family: var(--ui); font-size: 12px; color: var(--moss); display: block; margin-top: 4px; }
.sect { padding: 10px 14px 12px; border-bottom: 1px solid var(--stone); }
.sect h3 { margin: 0 0 8px; font-size: 12.5px; font-weight: 600; color: var(--moss); }
.row { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
.row > label { flex: 0 0 96px; color: var(--bark); font-size: 12.5px; }
.row .ctl { flex: 1; min-width: 0; display: flex; gap: 6px; align-items: center; }
.field { height: 30px; border: 1px solid var(--stone-2); background: var(--paper); border-radius: 6px; padding: 0 8px; width: 100%; min-width: 0; }
.dims { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.dims label { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; color: var(--moss); }
select.field { padding-right: 4px; }
.swatches { display: flex; flex-wrap: wrap; gap: 6px; }
.sw { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--stone-2); padding: 0; }
.sw.on { box-shadow: 0 0 0 2px var(--bark); }
.switch { position: relative; width: 36px; height: 20px; border-radius: 10px; background: var(--stone-2); border: 0; padding: 0; flex: none; }
.switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch.on { background: var(--bark); }
.switch.on::after { transform: translateX(16px); }
input[type=range] { accent-color: var(--bark); width: 100%; }
.rv { min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; color: var(--moss); font-size: 12px; }
.clear { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 12.5px; }
.clear span:nth-child(even) { font-family: var(--hand); font-size: 15px; text-align: right; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 12px 14px 16px; }
.note { margin: 10px 14px; padding: 10px 12px; background: var(--paper); border: 1px dashed var(--stone-2); border-radius: 8px; font-size: 12.5px; color: var(--moss); }
.list { padding: 4px 6px 8px; }
.li { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
.li:hover { background: var(--paper); }
.li .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.li .s { color: var(--moss); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.li button { border: 0; background: none; padding: 2px; color: var(--moss); display: flex; }
.li.hid .t { opacity: .45; }
.totals { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 5px 10px; font-size: 12.5px; }
.totals span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
.empty { padding: 14px; color: var(--moss); font-size: 12.5px; }

/* bottom */
#hint { position: fixed; left: 50%; top: 70px; transform: translateX(-50%); background: var(--bark); color: #f4f3ee; border-radius: 8px; padding: 8px 14px; font-size: 12.5px; z-index: 18; display: flex; gap: 14px; align-items: center; max-width: calc(100vw - 660px); }
#hint:empty { display: none; }
#hint b { color: var(--marigold); font-weight: 600; }
#hint .k { display: inline-block; border: 1px solid rgba(255,255,255,.3); border-radius: 4px; padding: 0 5px; font-size: 11.5px; margin: 0 1px; }
#hint button { border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; border-radius: 5px; padding: 3px 9px; }
#status { position: fixed; left: 314px; bottom: 16px; z-index: 16; display: flex; align-items: center; gap: 10px; }
#compass { width: 46px; height: 46px; border-radius: 50%; background: var(--lichen); border: 1px solid var(--stone); display: grid; place-items: center; }
#compass svg { transition: transform .08s linear; }
#status .fov { display: flex; align-items: center; gap: 7px; height: 32px; padding: 0 10px; background: var(--lichen); border: 1px solid var(--stone); border-radius: var(--r-ctl); font-size: 12.5px; }
#status .fov input { width: 96px; }
#status .fov output { min-width: 30px; font-variant-numeric: tabular-nums; color: var(--moss); }
#status .fov.off { opacity: .45; }
#cursorpos { position: absolute; left: 0; bottom: 56px; white-space: nowrap; background: rgba(238,241,234,.92); border: 1px solid var(--stone); border-radius: 7px; padding: 5px 9px; font-size: 12px; color: var(--moss); font-variant-numeric: tabular-nums; }
#cursorpos:empty { display: none; }
#tools { position: fixed; right: 314px; bottom: 16px; z-index: 16; display: flex; gap: 6px; }
#tools .btn { background: var(--lichen); border-color: var(--stone); }
#tools .btn.on { background: var(--bark); color: var(--paper); }

#lockBtn.on { background: var(--marigold); color: #2b1a00; }
body.move-locked #stage canvas { cursor: grab; }
.menu .mi small { display: block; color: var(--moss); font-size: 11.5px; margin-top: 1px; }
.menu .mi .tx { display: block; }

/* estimate */
#modal .card.wide { width: min(980px, 95vw); padding: 0; display: flex; flex-direction: column; max-height: 90vh; overflow: hidden; }
.est-h { padding: 20px 26px 14px; border-bottom: 1px solid var(--stone); display: grid; grid-template-columns: 1fr auto; gap: 6px 20px; align-items: end; }
.est-h h2 { grid-column: 1; }
.est-h p { grid-column: 1; margin: 0 !important; }
.est-total { grid-column: 2; grid-row: 1 / span 2; text-align: right; }
.est-total b { display: block; font-family: var(--hand); font-size: 34px; line-height: 1; font-weight: 400; }
.est-total span { color: var(--moss); font-size: 12px; }
.est-bar { padding: 10px 26px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--stone); background: var(--lichen); }
.est-bar .grow { flex: 1; }
.est-body { overflow-y: auto; padding: 4px 26px 10px; flex: 1; }
.est-cat { margin-top: 16px; }
.est-cat-h { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1.5px solid var(--bark); padding-bottom: 4px; }
.est-cat-h h3 { margin: 0; font-size: 14.5px; }
.est-cat-h span { font-variant-numeric: tabular-nums; font-weight: 600; }
#modal table.est { width: 100%; border-collapse: collapse; font-size: 12.5px; table-layout: fixed; }
#modal table.est td { padding: 5px 6px; border-bottom: 1px solid var(--lichen); vertical-align: middle; white-space: normal; width: auto; }
#modal table.est td.it { font-weight: 500; }
#modal table.est td.part { color: var(--moss); }
#modal table.est td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
#modal table.est tr.first td { border-top: 1px solid var(--stone); }
#modal table.est tr:first-child td { border-top: 0; }
.est td.pc { white-space: nowrap; }
.est td.pc .per { display: inline-block; width: 50px; text-align: left; padding-left: 4px; color: var(--moss); font-size: 11.5px; }
.est input.price { width: 76px; height: 26px; text-align: right; border: 1px solid transparent; background: transparent; border-radius: 5px; padding: 0 6px; font-variant-numeric: tabular-nums; }
.est input.price:hover, .est input.price:focus { border-color: var(--stone-2); background: #fff; }
.est input.price.edited { color: var(--marigold-ink); font-weight: 600; }
.est-foot { border-top: 1px solid var(--stone); padding: 12px 26px 16px; display: grid; grid-template-columns: 1fr auto; gap: 4px 24px; font-variant-numeric: tabular-nums; }
.est-foot span:nth-child(even) { text-align: right; }
.est-foot .big { font-weight: 700; font-size: 15px; }
.est-foot input { width: 46px; height: 24px; border: 1px solid var(--stone-2); border-radius: 5px; text-align: right; padding: 0 4px; background: #fff; }
.est-sum { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 5px 10px; font-size: 12.5px; }
.est-sum span:nth-child(even) { text-align: right; font-variant-numeric: tabular-nums; }
.est-sum .tot { font-weight: 700; border-top: 1px solid var(--stone-2); padding-top: 5px; }

/* photo strip */
#photos { position: fixed; left: 314px; right: 314px; bottom: 74px; z-index: 17; background: var(--lichen); border: 1px solid var(--stone); border-radius: var(--r-panel); padding: 10px 12px 12px; display: none; }
body.photos-open #photos { display: block; }
#photos .ph-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
#photos .ph-h b { font-size: 13.5px; }
#photos .ph-h span { color: var(--moss); font-size: 12px; }
.strip { display: flex; gap: 8px; overflow-x: auto; }
.strip button { flex: none; width: 128px; border: 2px solid transparent; border-radius: 7px; padding: 0; overflow: hidden; background: #ccc; position: relative; }
.strip button img { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; }
.strip button.on { border-color: var(--marigold); }
#photoOverlay { position: fixed; z-index: 4; pointer-events: none; display: none; }
#photoOverlay img { width: 100%; height: 100%; display: block; }
body[data-view=photo] #photoOverlay { display: block; }
#photoBar { position: fixed; top: 68px; left: 50%; transform: translateX(-50%); z-index: 19; background: var(--bark); color: #fff; border-radius: 9px; padding: 8px 10px 8px 14px; display: none; align-items: center; gap: 12px; }
body[data-view=photo] #photoBar { display: flex; }
#photoBar input { width: 140px; accent-color: var(--marigold); }
#photoBar .btn { color: #fff; border-color: rgba(255,255,255,.35); }

/* menus / popovers / modal */
.menu { position: fixed; z-index: 40; min-width: 240px; max-height: calc(100vh - 80px); overflow-y: auto; background: var(--paper); border: 1px solid var(--stone-2); border-radius: 9px; box-shadow: 0 10px 30px rgba(20,24,16,.18); padding: 6px; display: none; }
.menu.open { display: block; }
.menu .mi { display: flex; width: 100%; align-items: center; gap: 8px; padding: 8px 10px; border: 0; background: none; border-radius: 6px; text-align: left; }
.menu .mi:hover { background: var(--lichen); }
.menu .mi.cur { font-weight: 700; }
.menu .mi .tick { width: 14px; color: var(--marigold-ink); }
.menu hr { border: 0; border-top: 1px solid var(--stone); margin: 5px 4px; }
.menu .mh { padding: 6px 10px 4px; color: var(--moss); font-size: 12px; }
.pop { width: 330px; padding: 12px 14px; }
.pop .row > label { flex: 0 0 84px; }
.pop .seg button { padding: 0 10px; }
#modal { position: fixed; inset: 0; background: rgba(20,24,16,.4); z-index: 50; display: none; align-items: center; justify-content: center; }
#modal.open { display: flex; }
#modal .card { background: var(--paper); border-radius: 12px; width: min(620px, 92vw); max-height: 86vh; overflow: auto; padding: 22px 26px; }
#modal h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: -0.015em; }
#modal p { color: var(--moss); margin: 4px 0 14px; max-width: 62ch; }
#modal table { width: 100%; border-collapse: collapse; font-size: 13px; }
#modal td { padding: 6px 4px; border-bottom: 1px solid var(--lichen); vertical-align: top; }
#modal td:first-child { white-space: nowrap; width: 38%; }
kbd { font-family: var(--ui); font-size: 11.5px; border: 1px solid var(--stone-2); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: #fff; }
#toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-8px); background: var(--bark); color: #fff; padding: 8px 14px; border-radius: 8px; z-index: 60; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#loading { position: fixed; inset: 0; z-index: 100; background: var(--lichen); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; font-family: var(--hand); font-size: 22px; transition: opacity .4s; }
#loading.done { opacity: 0; pointer-events: none; }
#loading small { font-family: var(--ui); font-size: 13px; color: var(--moss); }
.collapse-btn { display: none; }
body.cat-collapsed #catalog { display: none; }
body.cat-collapsed #status { left: 10px; }
body.cat-collapsed #photos { left: 10px; }
@media (max-width: 1600px) {
  .hide-lg { display: none; }
  .time input[type=range] { width: 120px; }
}
@media (max-width: 1440px) {
  .brand span { display: none; }
  .time input[type=range] { width: 100px; }
}
@media (max-width: 1100px) {
  .time input[type=range] { width: 100px; }
  .hide-md { display: none; }
  #hint { max-width: calc(100vw - 40px); }
}
@media (max-width: 820px) {
  .panel { width: 250px; }
  #status, #tools { display: none; }
  #photos { left: 10px; right: 10px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body data-view="orbit">
<div id="stage"></div>
<div id="labels"></div>
<div id="photoOverlay"><img alt=""></div>

<header id="topbar">
  <div class="brand">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"/><path d="M5 20v-7l7-5 7 5v7"/><path d="M9 20v-4h6v4"/><circle cx="18.5" cy="5.5" r="2"/></svg>
    <span class="hide-md">Backyard planner</span>
  </div>
  <button class="btn outline" id="layoutBtn" aria-haspopup="menu" title="Switch or manage layouts"><span>Layout</span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></button>
  <button class="btn" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
  <button class="btn" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
  <button class="btn" id="lockBtn" aria-pressed="false" title="Lock moving so dragging only moves the camera (L)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path id="lockShackle" d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span class="hide-md">Lock moves</span></button>
  <div class="sep"></div>
  <div class="seg" role="tablist" aria-label="View">
    <button data-view="orbit" class="on" title="Orbit around the yard (1)">3D</button>
    <button data-view="plan" title="Top-down plan (2)">Plan</button>
    <button data-view="walk" title="Walk around at eye level (3)">Walk</button>
  </div>
  <button class="btn" id="viewsBtn" title="Viewpoints"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg><span class="hide-md hide-lg">Viewpoints</span></button>
  <button class="btn" id="photosBtn" title="See the yard from where each photo was taken"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg><span class="hide-md hide-lg">Photos</span></button>
  <div class="spacer"></div>
  <div class="time" title="Time of day: shadows, sunset and lights">
    <svg id="sunIcon" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <input type="range" id="timeRange" min="5" max="23.5" step="0.25" value="14" aria-label="Time of day">
    <span class="tval" id="timeVal">2:00 PM</span>
  </div>
  <button class="btn" id="nightBtn" title="Jump to evening to preview lighting">Evening</button>
  <button class="btn" id="settingsBtn" title="Sun, season, lawn and display settings" aria-label="Settings"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
  <div class="sep"></div>
  <button class="btn" id="costBtn" title="Materials list and cost estimate"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg><span class="hide-md">Estimate</span></button>
  <button class="btn" id="shotBtn" title="Save a picture of this view"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0-4-4m4 4 4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg><span class="hide-md hide-lg">Save image</span></button>
  <button class="btn" id="helpBtn" title="Shortcuts and tips" aria-label="Help">?</button>
</header>

<aside class="panel" id="catalog" aria-label="Add to your yard">
  <div class="panel-h"><h2>Add to your yard</h2><p>Click to place, or drag onto the yard. Drawn items let you click out a shape.</p></div>
  <div class="search"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" placeholder="Search: pool, fence, lights…" aria-label="Search items"></div>
  <div class="scroll" id="cats"></div>
</aside>

<aside class="panel" id="inspector" aria-label="Details"></aside>

<div id="status">
  <div id="compass" title="North"><svg width="30" height="30" viewBox="0 0 30 30"><path d="M15 3 19 15H11Z" fill="#b2412b"/><path d="M15 27 11 15h8Z" fill="#5e6857"/><text x="15" y="2" font-size="0" /></svg></div>
  <label class="fov" id="fovBox" title="Field of view: lower is like a zoom lens, higher is wide-angle"><span>FOV</span><input type="range" id="fovRange" min="25" max="100" step="1" value="50" aria-label="Field of view in degrees"><output id="fovVal">50°</output></label>
  <div id="cursorpos"></div>
</div>
<div id="tools">
  <button class="btn" id="arrangeBtn" aria-haspopup="menu" title="Spread out what you've added so nothing overlaps"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg>Arrange</button>
  <button class="btn" id="measureBtn" title="Measure a distance (M)"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 17 17 3l4 4L7 21Z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg>Measure</button>
  <button class="btn" id="snapBtn" title="Snap to grid">Snap 6"</button>
  <button class="btn" id="gridBtn" title="Show 1 ft grid (G)">Grid</button>
</div>
<div id="hint"></div>

<div id="photos">
  <div class="ph-h"><b>Your photos</b><span>Pick one to see your plan from about where it was taken</span></div>
  <div class="strip" id="strip"></div>
</div>
<div id="photoBar">
  <span id="photoLabel">Photo view</span>
  <label style="display:flex;gap:8px;align-items:center;font-size:12px">Photo <input type="range" id="photoOpacity" min="0" max="1" step="0.05" value="0.5" aria-label="Photo overlay opacity"></label>
  <button class="btn outline" id="photoExit" style="background:transparent">Back to 3D</button>
</div>

<div class="menu" id="layoutMenu" role="menu"></div>
<div class="menu" id="viewsMenu" role="menu"></div>
<div class="menu" id="arrangeMenu" role="menu"></div>
<div class="menu pop" id="settingsPop"></div>
<div id="modal" role="dialog" aria-modal="true"><div class="card" id="modalCard"></div></div>
<div id="toast" role="status"></div>
<div id="loading">Sketching your yard…<small>Building the 3D scene</small></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script id="assets" type="application/json">/*ASSETS*/</script>
<script>/*APP*/</script>
</body>
</html>
