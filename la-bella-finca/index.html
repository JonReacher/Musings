function restore(st){
  resetGame();
  const all = map.slice(0, NR_FARM).flat(), old = !st.cols;   // version 1 saves held only the original 32 × 32 valley
  if (old) for (const row of map) for (const t of row) if (t.r<N && t.c<N) t.b = 0;
  st.tiles.forEach((a,i) => { const t = old ? map[Math.floor(i/N)][i%N] : all[i]; if (!t) return;
    [t.t, t.owned, t.work, t.g, t.v, t.hp, t.pr, t.seen, t.top, t.worm, t.bmold, t.prot, t.shankHit, t.pick, t.tested, t.b, t.price] = a;
    t.owned = !!t.owned; t.work = t.work || null; t.v = t.v || null; t.shankHit = !!t.shankHit;
    Object.assign(t.soil, { ph:a[17], nit:a[18], drain:a[19], shank:a[20], consec:a[21], fallow:a[22] }); });
  const fresh = buildings.filter(b => b.c>=N || b.r>=N || b.type==='tienda');
  buildings.length = 0; st.buildings.forEach(b => buildings.push(b));
  if (old){ nextB = Math.max(st.nextB, ...buildings.map(b => b.id+1));   // bring in the new land's buildings and the town shop, with fresh ids
    for (const b of fresh){ const nb = { ...b, id:nextB++ }; buildings.push(nb); bldTiles(nb).forEach(t => t.b = nb.id); }
    for (let c=5;c<N;c++){ const t = map[4][c]; if (!t.owned && !t.b) t.t = t.t==='water' ? 'bridge' : 'road'; } }
  lots.length = 0; st.lots.forEach(l => lots.push(l));

// Saves live in the viewer's own private space on their Claude account when the page can reach it, otherwise in this browser.
const store = { mode:'local', db:null, uid:null, index:[], ready:false };
async function storeInit(){
  try {
    if (window.claude && window.claude.use){
      const got = await Promise.race([ Promise.all([window.claude.use('user'), window.claude.use('db')]), new Promise(r => setTimeout(() => r([null,null]), 9000)) ]);
      const [user, db] = got;
      if (user && db){ const id = await user.id(); if (id){ store.db = db; store.uid = id; store.mode = 'cloud'; } }
    }
  } catch(e){}
  await loadIndex(); store.ready = true;
}
const col = () => store.db.collection('data/users/' + store.uid);
async function loadIndex(){
  if (store.mode==='cloud'){ try { const snap = await col().doc('index').get(); store.index = snap.exists ? (snap.data().slots||[]) : []; return; } catch(e){ store.mode = 'local'; } }
  try { store.index = JSON.parse(localStorage.getItem('finca:index')||'[]'); } catch(e){ store.index = []; }
}
async function writeIndex(){
  if (store.mode==='cloud') await col().doc('index').set({ slots: store.index });
  else localStorage.setItem('finca:index', JSON.stringify(store.index));
}
async function writeSlot(id, st){
  const json = JSON.stringify(st);
  if (store.mode==='cloud') await col().doc('slot-'+id).set({ v:1, json });
  else localStorage.setItem('finca:slot-'+id, json);
}
async function readSlot(id){

async function removeSlot(id){

// ================= drawing helpers =================

function poly(pts, fill, stroke, lw){ ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y); for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y); ctx.closePath(); if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke();} }
function ell(x,y,rx,ry,fill){ ctx.beginPath(); ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,Math.PI*2); ctx.fillStyle=fill; ctx.fill(); }
function line(x1,y1,x2,y2,col,lw){ ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.stroke(); }

function drawSea(){

  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1.5;

    ctx.globalAlpha = (0.5+0.5*Math.sin(time*1.3+i))*0.8; ctx.beginPath(); ctx.arc(sx, sy, 7, Math.PI*1.15, Math.PI*1.85); ctx.stroke();

  if (o.tin){ for (let i=1;i<8;i++){ const q=fp(B2,R2,i/8,0); line(q.x,q.y,A.x+(q.x-A.x)*0.12,A.y+(q.y-A.y)*0.12,'rgba(255,255,255,0.35)',0.9);} }
  if (o.tiles){ for (let i=1;i<5;i++){ const a=fp(L2,A,i/5,0), c2=fp(B2,A,i/5,0); line(a.x,a.y,c2.x,c2.y,'rgba(90,30,15,0.35)',1); } }
  if (o.patches){ poly([fp(L2,A,0.3,0),fp(B2,A,0.3,0),fp(B2,A,0.45,0),fp(L2,A,0.45,0)],'#7f7350'); }
  if (o.sign && !ghost){ const s0 = up(fp(L,B,0.5,0), h+o.rh+4); ctx.fillStyle='#f6e7c1'; ctx.fillRect(s0.x-15,s0.y-8,30,9); ctx.strokeStyle='#5b3517'; ctx.lineWidth=1; ctx.strokeRect(s0.x-15,s0.y-8,30,9); ctx.fillStyle='#8a2f1f'; ctx.font='800 6.5px Nunito, sans-serif'; ctx.textAlign='center'; ctx.fillText(biz.brand ? biz.brand.name.split(' ').slice(-1)[0].slice(0,9).toUpperCase() : 'CIGARS', s0.x, s0.y-1.5);
    if (b.busy>0){ const q=fp(B,R,0.5,0); person(q.x+10,q.y+8,'#e8c35a',time*4,null); person(q.x+18,q.y+12,'#6aa0c8',time*4+1,null); } }
  if (o.shopfront && !ghost){ const s0 = fp(B,R,0.5,h*0.92); const mine = o.owned, txt = mine ? (biz.brand ? biz.brand.name.toUpperCase().slice(0,14) : 'TABACOS') : 'SE VENDE';

  if (o.cross){ const top={x:A.x,y:A.y}; line(top.x,top.y,top.x,top.y-12,'#e9e2d0',2); line(top.x-4,top.y-8,top.x+4,top.y-8,'#e9e2d0',2); }
  if (!ghost && b.type==='barn' && b.built && b.owned && staff.tender){ const q=fp(B,R,0.18,0); person(q.x+2,q.y+5, staff.tender==='pro'?'#f1ede2':staff.tender==='mid'?'#5f8fb8':'#c94f3a', 0, null); }
  if (!ghost && b.type==='ferm' && b.built && b.owned && workerOf('turner') && b.piles.some(id => lots.some(l => l.id===id && l.stage==='fermenting'))){ const q=fp(B,R,0.2,0); person(q.x+2,q.y+5, staff.crew.turner==='pro'?'#efe6cf':'#9a6a3c', 0, null); }
  if (!ghost && b.type==='ware' && b.built && b.owned && workerOf('baler') && lots.some(l => l.stage==='fermented')){ const q=fp(B,R,0.2,0); person(q.x+2,q.y+5, staff.crew.baler==='pro'?'#b83a2c':'#e8c35a', 0, null); }

    for (let i=0;i<3;i++){ const ph=(time*0.5+i/3)%1; ctx.globalAlpha=0.45*(1-ph); ell(c.x+0.5+ph*8, c.y-11-ph*18, 2.5+ph*4, 2+ph*3, '#f2f2f2'); } ctx.globalAlpha=1; }

    if (hot.length){ const mx=Math.max(...hot.map(l=>l.temp)); for (let i=0;i<3;i++){ const ph=(time*0.4+i/3)%1; ctx.globalAlpha=0.35*(1-ph); ell(A.x+Math.sin(time+i)*3, A.y-6-ph*16, 3+ph*3, 2+ph*2, mx>112?'#ffb38a':'#fff3dd'); } ctx.globalAlpha=1; }
  }

function drawObjects(t){
  const P=(u,v)=>iso(t.c+u,t.r+v);
  if (t.b){ const b=Bid(t.b); if (t.c===b.c+b.w-1 && t.r===b.r+b.h-1) building(b, lookOf(b)); return; }
  if (t.cb){ const b = cityB[t.cb-1]; if (t.c===b.c+b.w-1 && t.r===b.r+b.h-1) drawCityB(b); return; }
  if (t.r>=NR_FARM){ drawCityDecor(t); return; }
  if (t.r===NR_FARM-1 && t.c===4){ const q=P(0.82,0.5); line(q.x,q.y,q.x,q.y-26,'#5b3517',2.2); ctx.fillStyle='#fbf7ec'; ctx.strokeStyle='#5b3517'; ctx.lineWidth=1.2; ctx.beginPath(); ctx.moveTo(q.x-4,q.y-34); ctx.lineTo(q.x+58,q.y-34); ctx.lineTo(q.x+66,q.y-28); ctx.lineTo(q.x+58,q.y-22); ctx.lineTo(q.x-4,q.y-22); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.fillStyle='#8a2f1f'; ctx.font='800 6.4px Nunito, sans-serif'; ctx.textAlign='left'; ctx.fillText(city.unlocked?'PUERTO CELESTE ↓':'PUERTO CELESTE · 2h', q.x-1, q.y-25.6); }
  if (t.work==='seeded'){
    const s = stageOf(t.g), pts = [];
    for (let i=0;i<3;i++) for (let j=0;j<3;j++) pts.push([0.2+0.3*j, 0.2+0.3*i, ((i*3+j)*0.137+t.n)%1]);
    pts.sort((a,b)=>(a[0]+a[1])-(b[0]+b[1]));
    const fx = { top:t.top, worm:t.worm||0, mold:t.bmold||0, wilt:t.shankHit };
    for (const [u,v,nn] of pts){ const q=P(u,v); drawPlant(q.x,q.y,s,t.v,nn,t.hp,t.pr,t.g,fx); }
    if (t.pick>0){ const q=P(0.5+0.12*Math.sin(time*0.7+t.n*5),0.62); person(q.x,q.y,'#4f7fa8',time*6,null); }
    return;
  }
  if (t.pick>0){ for (let i=0;i<2;i++){ const q=P(0.3+0.4*i+0.08*Math.sin(time*0.8+i*2+t.n*5), 0.45+0.25*i); person(q.x,q.y, i?'#e8e2d0':'#4f7fa8', time*6+i*1.7, i?null:'#7fb04e'); } }
  if (t.work==='stalks' && !(t.pick>0)){ for (let i=0;i<3;i++) for (let j=0;j<3;j++){ const q=P(0.2+0.3*j,0.2+0.3*i); drawStalk(q.x,q.y,((i+j)*0.3+t.n)%1); } return; }
  if (t.work==='cover'){ const sz = Math.min(1, 0.3 + t.g/60); for (let i=0;i<3;i++) for (let j=0;j<3;j++){ const q=P(0.18+0.32*j,0.18+0.32*i); ell(q.x+1,q.y,5*sz,2*sz,'rgba(30,40,10,0.2)'); ell(q.x-2*sz,q.y-2*sz,3.4*sz,2.4*sz,'#5d9a3a'); ell(q.x+2*sz,q.y-2.4*sz,3.4*sz,2.4*sz,'#6dab45'); ell(q.x,q.y-4*sz,2.8*sz,2*sz,'#7fbd52'); } return; }
  if (t.work) return;
  if (lodLow){ if (t.t==='forest'){ const q=P(0.5,0.5); ell(q.x,q.y-10,22,14,'#3e9442'); ell(q.x-6,q.y-16,9,7,'#63b25a'); } else if (t.t==='scrub'){ const q=P(0.5,0.5); ell(q.x,q.y-4,16,8,'#7c9d33'); } return; }
  if (t.t==='forest'){
    const q1=P(0.3,0.35), q2=P(0.7,0.65);
    if (t.n<0.45){ palm(q1.x,q1.y,32+8*t.n2,t.n); broadTree(q2.x,q2.y,0.9); }
    else { broadTree(q1.x,q1.y,0.85+0.2*t.n2); if (t.n2>0.4) palm(q2.x,q2.y,30+10*t.n,t.n2); else broadTree(q2.x,q2.y,0.95); }
  } else if (t.t==='scrub'){
    const q1=P(0.3,0.4), q2=P(0.68,0.62), q3=P(0.55,0.25); bush(q3.x,q3.y); bush(q1.x,q1.y); bush(q2.x,q2.y);

}
const up = t => -(t.h||0)*ELEV;
let lodLow = false;   // zoomed far out: skip the small details
function vis(t, upPx){ const p=iso(t.c,t.r), sx=cam.x+p.x*cam.z, sy=cam.y+p.y*cam.z; return sx>-TW*cam.z && sx<W+TW*cam.z && sy>-TH*cam.z && sy<H+upPx*cam.z; }
function drawFences(){
  ctx.lineCap='round';
  for (const row of map) for (const t of row){
    if (!t.owned || !vis(t,20)) continue;
    const p0=iso(t.c,t.r), p={x:p0.x, y:p0.y+up(t)}, Tp={x:p.x,y:p.y}, R={x:p.x+TW/2,y:p.y+TH/2}, B={x:p.x,y:p.y+TH}, L={x:p.x-TW/2,y:p.y+TH/2};
    for (const [nb,a,b] of [[T(t.r-1,t.c),Tp,R],[T(t.r,t.c-1),Tp,L],[T(t.r+1,t.c),L,B],[T(t.r,t.c+1),R,B]]){
      if (nb && nb.owned) continue;
      line(a.x,a.y,b.x,b.y,'rgba(255,244,200,0.95)',2.2); line(a.x,a.y+1.6,b.x,b.y+1.6,'rgba(90,55,20,0.45)',1);
      for (const q of [a,b,{x:(a.x+b.x)/2,y:(a.y+b.y)/2}]) ell(q.x,q.y,1.8,1.8,'#7a4b25');
    }
  }
  ctx.lineCap='butt';
}
function drawSelection(){
  if (sel){
    const actSet = new Set(sel.act), eligSet = new Set(sel.elig);
    for (let r=sel.r0;r<=sel.r1;r++) for (let c=sel.c0;c<=sel.c1;c++){
      const t=map[r][c]; if (eligSet.has(t)) continue;
      const p=iso(c,r); diamondPath(p.x,p.y+up(t),0.92); ctx.fillStyle='rgba(220,60,40,0.18)'; ctx.fill();
    }
    for (const t of sel.elig){ const p=iso(t.c,t.r); diamondPath(p.x,p.y+up(t),0.92); ctx.fillStyle = actSet.has(t)?'rgba(150,255,110,0.45)':'rgba(255,190,80,0.45)'; ctx.fill(); }
  }
  if (tool==='build' && hover && !pan){
    const fp = footprint(hover), bad = canPlace(fp) || BTYPES[btype].cost>cash;
    for (const t of fp) if (t){ const p=iso(t.c,t.r); diamondPath(p.x,p.y+up(t),0.94); ctx.fillStyle = bad?'rgba(220,60,40,0.35)':'rgba(150,255,110,0.42)'; ctx.fill(); }
  }
}
function drawGhost(){
  if (tool!=='build' || !hover || pan) return;
  const fp = footprint(hover); if (canPlace(fp)) return;
  ctx.save(); ctx.translate(0, up(hover)); ctx.globalAlpha = 0.55; building({ c:hover.c, r:hover.r, w:BTYPES[btype].w, h:BTYPES[btype].h, type:btype, built:true, id:-1, piles:[0,0] }, LOOK[btype], true); ctx.globalAlpha = 1; ctx.restore();
}
function drawSelectionOutline(){
  if (!sel) return;
  ctx.setLineDash([6,4]); ctx.lineDashOffset = -time*20;
  poly([iso(sel.c0,sel.r0),iso(sel.c1+1,sel.r0),iso(sel.c1+1,sel.r1+1),iso(sel.c0,sel.r1+1)],null,'rgba(255,255,255,0.95)',2.2/cam.z); ctx.setLineDash([]);
}
function drawHover(){
  if (!hover || drag || pan || tool==='build') return;
  const p=iso(hover.c,hover.r); diamondPath(p.x,p.y+up(hover),0.96);
  if (tool!=='inspect' && eligible(tool,hover)){ ctx.fillStyle='rgba(150,255,110,0.3)'; ctx.fill(); }
  ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=1.6/cam.z; ctx.stroke();
}
function drawForSaleTint(){
  if (tool!=='buy') return;
  for (const row of map) for (const t of row){ if (!forSale(t) || !vis(t,20)) continue; const p=iso(t.c,t.r); diamondPath(p.x,p.y+up(t),0.9); ctx.fillStyle='rgba(255,230,120,0.16)'; ctx.fill(); }
}
function drawSoilOverlay(){
  if (tool!=='soil') return;
  for (const row of map) for (const t of row){
    if (!(t.owned || forSale(t)) || t.b || !PLANT_T.concat(['scrub','forest']).includes(t.t) || !vis(t,20)) continue;
    const p = iso(t.c,t.r); diamondPath(p.x,p.y+up(t),0.86);
    if (!t.tested){ ctx.fillStyle='rgba(90,80,70,0.22)'; ctx.fill(); continue; }
    const sc = soilScore(t);
    ctx.fillStyle = sc>=0.88?'rgba(90,200,70,0.45)': sc>=0.74?'rgba(200,210,70,0.45)': sc>=0.6?'rgba(240,160,60,0.45)':'rgba(220,60,40,0.45)'; ctx.fill();
  }
}
function drawGrid(){
  if (tool==='inspect') return;
  ctx.strokeStyle='rgba(0,0,0,0.08)'; ctx.lineWidth=1/cam.z; ctx.beginPath();
  for (const row of map) for (const t of row){ if (t.r>=NR_FARM || !vis(t,20)) continue; const p=iso(t.c,t.r), y=p.y+up(t); ctx.moveTo(p.x,y); ctx.lineTo(p.x+TW/2,y+TH/2); ctx.lineTo(p.x,y+TH); ctx.lineTo(p.x-TW/2,y+TH/2); ctx.closePath(); }
  ctx.stroke();
}
function drawFloats(dt){
  ctx.font='800 15px Nunito, sans-serif'; ctx.textAlign='center';
  for (let i=floats.length-1;i>=0;i--){
    const f=floats[i]; f.t+=dt; if (f.t>1.6){ floats.splice(i,1); continue; }
    ctx.globalAlpha = Math.min(1, 2*(1.6-f.t)); const y=f.y-f.t*26;
    ctx.lineWidth=4; ctx.strokeStyle='#5b3517'; ctx.strokeText(f.text,f.x,y); ctx.fillStyle='#ffe08a'; ctx.fillText(f.text,f.x,y);
  }
  ctx.globalAlpha=1;
}
// weather overlay (screen space)
const drops = Array.from({length:320}, () => ({ x:Math.random(), y:Math.random(), s:0.6+Math.random()*0.6 }));
let flash = 0, cloudT = 0;
function drawWeather(dt){
  const raining = wx==='Rain'||wx==='Storm', storm = wx==='Storm';
  const target = storm?0.32 : raining?0.2 : wx==='Cloudy'?0.08 : 0;
  cloudT += (target-cloudT)*Math.min(1,dt*1.5);
  if (cloudT>0.005){ ctx.fillStyle=`rgba(40,55,70,${cloudT})`; ctx.fillRect(0,0,W,H); }
  if (raining){
    const n = storm?320:170; ctx.strokeStyle = 'rgba(210,230,245,0.55)'; ctx.lineWidth = 1.2; ctx.beginPath();
    for (let i=0;i<n;i++){ const d=drops[i]; d.y += dt*(storm?1.6:1.1)*d.s; d.x += dt*(storm?0.25:0.08); if (d.y>1){ d.y-=1; d.x=Math.random(); } if (d.x>1) d.x-=1;
      const x=d.x*W, y=d.y*H; ctx.moveTo(x,y); ctx.lineTo(x-(storm?5:2), y-14*d.s); }
    ctx.stroke();
    if (storm && Math.random()<dt*0.25) flash = 1;
  }
  if (flash>0){ ctx.fillStyle=`rgba(255,255,240,${flash*0.45})`; ctx.fillRect(0,0,W,H); flash -= dt*3; }
}

// ================= loop =================
let last = performance.now(), opsTimer = 0;
function frame(now){
  try { step(now); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}
function step(now){
  const dt = Math.min(0.05,(now-last)/1000); last = now; time += dt;
  const dd = dt*SPEEDS[speedIdx]; days += dd;
  if (dd>0) for (const row of map) for (const t of row) if (t.work==='seeded') t.g = Math.min(175, t.g + dd*(0.9+0.2*t.n));
  while (dayInt < Math.floor(days)){ dayInt++; dailyTick(); }
  $('date').textContent = dateStr(); updateWeatherHUD();
  if (drag) updateSel();
  updateInfo();
  opsTimer += dt; if (opsTimer>0.25){ opsTimer=0; renderOps(false); $('cash').textContent = fmt(cash); }
  if (gameId && dirty && !saving && now - lastSaveReal > 60000) saveGame(false);
  sceneTimer += dt; if (scene && sceneTimer > 1.2 && speedIdx){ sceneTimer = 0; renderScene(); }

  lodLow = cam.z < 0.4;
  ctx.setTransform(DPR,0,0,DPR,0,0); drawSea();
  ctx.setTransform(DPR*cam.z,0,0,DPR*cam.z,DPR*cam.x,DPR*cam.y);
  poly(bigDiamond(2.2),'rgba(120,220,215,0.55)'); poly(bigDiamond(1.2),'rgba(150,232,220,0.6)'); poly(bigDiamond(0.55),'#ead49a');
  const lift = (t, fn) => { const h = t.h||0; if (h) { ctx.save(); ctx.translate(0, -h*ELEV); fn(t); ctx.restore(); } else fn(t); };
  for (const row of map) for (const t of row) if ((t.r===NR-1||t.c===NC-1) && vis(t,60)) lift(t, drawEdgeFaces);
  for (let d=0; d<=NR+NC-2; d++) for (let r=Math.max(0,d-NC+1); r<Math.min(NR,d+1); r++){ const c=d-r; if (vis(map[r][c],40)) lift(map[r][c], drawGround); }
  drawGrid(); drawForSaleTint(); drawSoilOverlay(); drawSelection(); drawFences(); drawHover();
  for (let d=0; d<=NR+NC-2; d++) for (let r=Math.max(0,d-NC+1); r<Math.min(NR,d+1); r++){ const c=d-r; if (vis(map[r][c], r>=NR_FARM?420:120)) lift(map[r][c], drawObjects); }
  drawGhost(); drawFloats(dt);
  ctx.setTransform(DPR,0,0,DPR,0,0); drawWeather(dt);
}
window.addEventListener('resize', resize);
resize(); initCam(); setTool('inspect'); refreshUI(); updateWeatherHUD(); setSpeed(0);
requestAnimationFrame(frame);
renderMenu(); storeInit().then(renderMenu);
})();
